<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزعيم IPTV</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('IMG_6458.jpeg'); /* صورتك الخاصة */
            background-color: #0f0f0f; 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px 10px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: -1;
        }

        h1 { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); font-size: 28px; margin-bottom: 20px; }
        h2 { color: #FFD700; text-align: right; padding-right: 10px; font-size: 20px; margin-top: 30px; border-right: 4px solid #FFD700; padding-right: 15px; }

        .player-container {
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            border: 2px solid #333;
            position: relative;
            padding-top: 56.25%;
        }

        video, iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        #ytPlayer { display: none; }

        /* تصميم أزرار القنوات الثابتة */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
        }

        .channel-btn {
            background-color: rgba(30, 30, 30, 0.9);
            color: white;
            border: 1px solid #444;
            padding: 15px 5px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .channel-btn:hover, .channel-btn.active {
            background-color: #FFD700;
            color: #000;
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
        }

        /* تصميم قوائم الاختيار */
        .selector-container {
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 12px;
            max-width: 600px;
            margin: 20px auto;
            border: 1px solid #444;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .load-btn {
            padding: 12px 20px;
            background-color: #FFD700;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-bottom: 15px;
        }
        
        .load-btn:hover { background-color: #fff; }

        .search-box {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #FFD700;
            background-color: #222;
            color: white;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .search-box::placeholder { color: #aaa; }

        /* قائمة القنوات المخصصة (لعرض الشعارات) */
        .channel-list-container {
            max-height: 400px;
            overflow-y: auto;
            background-color: #111;
            border: 1px solid #FFD700;
            border-radius: 8px;
            margin-top: 10px;
            display: none; /* مخفي حتى يتم التحميل */
        }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background 0.2s;
        }

        .channel-item:hover {
            background-color: #222;
        }

        .channel-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            margin-left: 15px; /* المسافة بين الصورة والاسم */
            background-color: white; /* خلفية بيضاء للشعارات الشفافة */
            border-radius: 5px;
            padding: 2px;
        }

        .channel-name {
            font-size: 16px;
            font-weight: bold;
            color: #ddd;
        }
    </style>
</head>
<body>

    <h1>👑 الزعيم IPTV 👑</h1>
    
    <!-- المشغل -->
    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
        <iframe id="ytPlayer" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>

    <!-- قسم قنوات M3U -->
    <h2>🌐 القنوات العربية (M3U)</h2>
    <div class="selector-container">
        <input type="text" id="m3uUrlInput" value="https://iptv-org.github.io/iptv/regions/arab.m3u" style="display:none;"> 
        
        <button class="load-btn" onclick="loadM3U()">تحميل القنوات العربية</button>
        
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن قناة هنا..." onkeyup="filterChannels()">
        
        <!-- بدلاً من القائمة المنسدلة، سنستخدم حاوية لعرض القنوات بالصور -->
        <div class="channel-list-container" id="channelListContainer">
            <!-- سيتم إضافة القنوات هنا بواسطة الجافاسكريبت -->
        </div>
    </div>

    <!-- قسم القنوات المباشرة الثابتة -->
    <h2>📺 القنوات المباشرة (المضمونة)</h2>
    <div class="channels-grid">
        <button class="channel-btn" onclick="playChannel('https://svs.itworkscdn.net/syriatvlive/syriatv.smil/playlist_dvr.m3u8', this)">التلفزيون السوري</button>
        <button class="channel-btn" onclick="playChannel('https://svs.itworkscdn.net/syriadramalive/syriadrama.smil/playlist_dvr.m3u8', this)">سوريا دراما</button>
        <button class="channel-btn" onclick="playChannel('https://live-hls-web-aja.getaj.net/AJA/01.m3u8', this)">الجزيرة</button>
        <button class="channel-btn" onclick="playChannel('https://mn-nl.mncdn.com/alkass/live/alkass1/index.m3u8', this)">الكأس 1</button>
    </div>

    <!-- قسم المسلسل -->
    <h2>🎬 مسلسل الإمام أحمد بن حنبل</h2>
    <div class="selector-container">
        <select class="series-select" id="episodeSelect" onchange="playYouTube(this.value)" style="margin-top:0; width:100%; padding:15px; font-size:18px; font-weight:bold; color:#FFD700; background-color:#111; border:2px solid #FFD700; border-radius:8px; outline:none; text-align:center;">
            <option value="" disabled selected>-- اختر الحلقة --</option>
            <option value="rAOJZMPjxLc">الحلقة 1</option>
            <option value="e8jh0NfoUxQ">الحلقة 2</option>
            <option value="nN5A1RGBF3c">الحلقة 3</option>
            <option value="UI6qR865ehg">الحلقة 4</option>
            <option value="8NJE5yb_lqw">الحلقة 5</option>
            <option value="g5FrTDkth1I">الحلقة 6</option>
            <option value="_9Q7Nf1Ui7Q">الحلقة 7</option>
            <option value="zNcIpZu5Yhw">الحلقة 8</option>
            <option value="AAMwQCeeVZI">الحلقة 9</option>
            <option value="dDHnvmGSemw">الحلقة 10</option>
            <option value="AjS0rtLjX8A">الحلقة 11</option>
            <option value="dAtMZ-U9taA">الحلقة 12</option>
            <option value="EtE8uK22X-w">الحلقة 13</option>
            <option value="qsNdkdS81Q0">الحلقة 14</option>
            <option value="8I5TxMoAcOQ">الحلقة 15</option>
            <option value="5pPYjrfbkuw">الحلقة 16</option>
            <option value="ty516Uh3xP8">الحلقة 17</option>
            <option value="P82rEDYDozU">الحلقة 18</option>
            <option value="tq_SBbmJJ8A">الحلقة 19</option>
            <option value="d1fns8LG3uo">الحلقة 20</option>
            <option value="V6yPHEXN1fg">الحلقة 21</option>
            <option value="VtJuAWosqM4">الحلقة 22</option>
            <option value="hNXkpfyPi_Q">الحلقة 23</option>
            <option value="zCJWST2u6Vw">الحلقة 24</option>
            <option value="E41YElDToHw">الحلقة 25</option>
            <option value="JHgGELihZjs">الحلقة 26</option>
            <option value="ofkmmFBkx4o">الحلقة 27</option>
            <option value="4thw1O2Ql-k">الحلقة 28</option>
            <option value="D-eeoZP5Ido">الحلقة 29</option>
            <option value="RDPSiRV4TxY">الحلقة 30 (الأخيرة)</option>
        </select>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const ytPlayer = document.getElementById('ytPlayer');
        const episodeSelect = document.getElementById('episodeSelect');
        const searchInput = document.getElementById('searchInput');
        const channelListContainer = document.getElementById('channelListContainer');
        
        let allChannels = [];

        // 1. تشغيل القنوات المباشرة الثابتة
        function playChannel(url, btnElement) {
            ytPlayer.style.display = 'none';
            video.style.display = 'block';
            video.src = url;
            video.play();
            
            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            
            episodeSelect.selectedIndex = 0;
        }

        // 2. تشغيل فيديوهات يوتيوب (المسلسل)
        function playYouTube(videoId) {
            if(!videoId) return; 
            video.style.display = 'none';
            video.pause(); 
            ytPlayer.style.display = 'block';
            ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&mute=1`;
            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
        }

        // 3. دالة تحميل قنوات M3U (مع الشعارات)
        function loadM3U() {
            const url = document.getElementById('m3uUrlInput').value;
            
            if (!url) {
                alert("الرجاء وضع رابط M3U أولاً");
                return;
            }

            channelListContainer.innerHTML = '<p style="padding:10px;">جاري تحميل القنوات...</p>';
            channelListContainer.style.display = 'block';
            searchInput.style.display = 'block';

            fetch(url)
                .then(response => response.text())
                .then(data => {
                    channelListContainer.innerHTML = ''; // تفريغ الحاوية
                    const lines = data.split('\n');
                    let currentChannelName = "";
                    let currentChannelLogo = "";
                    allChannels = [];

                    for (let i = 0; i < lines.length; i++) {
                        let line = lines[i].trim();
                        
                        // استخراج الاسم والشعار
                        if (line.startsWith('#EXTINF:')) {
                            // استخراج الشعار
                            let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                            currentChannelLogo = logoMatch ? logoMatch[1] : "https://via.placeholder.com/40/333/FFD700?text=TV"; // صورة افتراضية
                            
                            // استخراج الاسم
                            let commaIndex = line.lastIndexOf(',');
                            if (commaIndex !== -1) {
                                currentChannelName = line.substring(commaIndex + 1).trim();
                            }
                        } 
                        // استخراج الرابط
                        else if (line.startsWith('http') && currentChannelName !== "") {
                            allChannels.push({ name: currentChannelName, url: line, logo: currentChannelLogo });
                            currentChannelName = ""; 
                            currentChannelLogo = "";
                        }
                    }
                    renderChannels(allChannels); // عرض القنوات
                })
                .catch(error => {
                    console.error("خطأ في التحميل:", error);
                    channelListContainer.innerHTML = '<p style="padding:10px;">حدث خطأ، جرب مرة أخرى</p>';
                });
        }

        // 4. دالة عرض القنوات في الحاوية
        function renderChannels(channels) {
            channelListContainer.innerHTML = '';
            if (channels.length === 0) {
                channelListContainer.innerHTML = '<p style="padding:10px;">لا توجد قنوات</p>';
                return;
            }
            
            channels.forEach(channel => {
                let item = document.createElement('div');
                item.className = 'channel-item';
                item.onclick = function() { playM3UChannel(channel.url); };
                
                // وضع الصورة والاسم
                item.innerHTML = `
                    <img src="${channel.logo}" class="channel-logo" onerror="this.src='https://via.placeholder.com/40/333/FFD700?text=TV'">
                    <span class="channel-name">${channel.name}</span>
                `;
                channelListContainer.appendChild(item);
            });
        }

        // 5. دالة البحث والتصفية (تعديل لتشمل الصور)
        function filterChannels() {
            const filter = searchInput.value.toLowerCase();
            
            const filtered = allChannels.filter(channel => 
                channel.name.toLowerCase().includes(filter)
            );

            renderChannels(filtered); // عرض النتائج المفلترة
        }

        // 6. تشغيل قناة من القائمة
        function playM3UChannel(url) {
            if(!url) return;
            ytPlayer.style.display = 'none';
            video.style.display = 'block';
            video.src = url;
            video.play();
            
            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
            episodeSelect.selectedIndex = 0;
        }

        // تشغيل أول قناة عند فتح الصفحة
        window.onload = function() {
            const firstBtn = document.querySelector('.channel-btn');
            if (firstBtn) firstBtn.click();
        };
    </script>
</body>
</html>
