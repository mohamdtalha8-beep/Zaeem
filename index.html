<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزعيم - IPTV</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('IMG_6458.jpeg'); 
            background-color: #1a1a1a; 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px 10px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); 
            z-index: -1;
        }

        h1 { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); font-size: 28px; margin-bottom: 5px; }
        p.subtitle { color: #aaa; margin-top: 0; margin-bottom: 20px; }
        
        .player-container {
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            border: 2px solid #333;
            position: relative;
            padding-top: 56.25%;
        }

        video, iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        /* إخفاء مشغل يوتيوب في البداية */
        #ytPlayer { display: none; }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
        }

        .channel-btn {
            background-color: rgba(30, 30, 30, 0.9);
            color: white;
            border: 1px solid #444;
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .channel-btn:hover, .channel-btn.active {
            background-color: #FFD700;
            color: #000;
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
        }

        .yt-btn {
            background-color: rgba(200, 0, 0, 0.8);
            border-color: #f00;
        }
        .yt-btn:hover {
            background-color: #f00;
            color: white;
        }
    </style>
</head>
<body>

    <h1>👑 الزعيم IPTV 👑</h1>
    
    <div class="player-container">
        <!-- مشغل القنوات العادي -->
        <video id="videoPlayer" controls autoplay></video>
        <!-- مشغل يوتيوب المدمج -->
        <iframe id="ytPlayer" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>

    <h2 style="color: #FFD700; margin-top: 20px;">📺 القنوات المباشرة</h2>
    <div class="channels-grid">
        <button class="channel-btn" onclick="playChannel('https://svs.itworkscdn.net/syriatvlive/syriatv.smil/playlist_dvr.m3u8', this)">التلفزيون السوري</button>
        <button class="channel-btn" onclick="playChannel('https://svs.itworkscdn.net/syriadramalive/syriadrama.smil/playlist_dvr.m3u8', this)">سوريا دراما</button>
        <button class="channel-btn" onclick="playChannel('https://live-hls-web-aja.getaj.net/AJA/01.m3u8', this)">الجزيرة</button>
    </div>

    <h2 style="color: #FFD700; margin-top: 30px;">🎬 مسلسل الإمام أحمد بن حنبل</h2>
    <p style="color: #aaa; font-size: 14px;">اضغط على الحلقة للمشاهدة داخل التطبيق</p>
    
    <div class="channels-grid">
        <!-- هنا الروابط الحقيقية للحلقات الأولى (للتجربة) -->
        <button class="channel-btn yt-btn" onclick="playYouTube('9TqI1qVqL40', this)">الحلقة 1</button>
        <button class="channel-btn yt-btn" onclick="playYouTube('2r5U8x5Qe3g', this)">الحلقة 2</button>
        <button class="channel-btn yt-btn" onclick="playYouTube('2w7O9Wn4x8w', this)">الحلقة 3</button>
        
        <!-- يمكنك إضافة باقي الحلقات هنا بنفس الطريقة -->
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const ytPlayer = document.getElementById('ytPlayer');
        
        // دالة تشغيل القنوات المباشرة
        function playChannel(url, btnElement) {
            ytPlayer.style.display = 'none';
            video.style.display = 'block';
            video.src = url;
            video.play();
            setActive(btnElement);
        }

        // دالة تشغيل فيديوهات يوتيوب داخل الموقع
        function playYouTube(videoId, btnElement) {
            video.style.display = 'none';
            video.pause();
            ytPlayer.style.display = 'block';
            ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            setActive(btnElement);
        }

        function setActive(btnElement) {
            const buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
        }

        // تشغيل أول قناة عند فتح الصفحة
        window.onload = function() {
            const firstBtn = document.querySelector('.channel-btn');
            if (firstBtn) firstBtn.click();
        };
    </script>
</body>
</html>
