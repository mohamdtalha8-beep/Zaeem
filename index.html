<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع Zaeem - IPTV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #4CAF50; }
        .player-container {
            max-width: 800px;
            margin: 0 auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .note {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>مرحباً بك في برنامج IPTV الخاص بي</h1>
    <p>هذا البرنامج الأول من أجل التعلم</p>

    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
    </div>
    
    <div class="note">
        <p>القناة التجريبية تعمل الآن (قد تحتاج للضغط على زر التشغيل).</p>
    </div>

    <script>
        // رابط قناة تجريبية مفتوحة المصدر
        const channelUrl = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";
        
        // ربط المشغل بالفيديو
        const video = document.getElementById('videoPlayer');
        video.src = channelUrl;
    </script>

</body>
</html>
