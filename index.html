<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الزعيم IPTV</title>
    <style>
        /* --- إعدادات عامة للشاشة --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: #0b0b0b; /* خلفية سوداء داكنة جداً */
            color: white;
            overflow-x: hidden;
            padding-bottom: 100px; /* مساحة لشريط التنقل السفلي */
        }

        /* --- شاشة الترحيب --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; transition: opacity 1s ease-in-out;
        }
        .splash-image { width: 200px; border-radius: 20px; box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); margin-bottom: 20px; }
        .splash-title { color: #FFD700; font-size: 36px; font-weight: bold; text-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }

        /* --- محتوى التطبيق --- */
        #app-content { display: none; padding: 20px 20px; }
        
        h2 { color: #fff; font-size: 18px; margin: 20px 0 15px 0; font-weight: bold; }
        
        /* --- شبكة البطاقات (Posters Grid) --- */
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .poster-card {
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* تأثير التحديد بالريموت */
        .poster-card:hover, .poster-card:focus {
            transform: scale(1.05);
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            outline: none;
        }

        .poster-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #333;
            display: block;
        }

        .poster-title {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #ddd;
        }

        /* --- شريط التنقل السفلي (Bottom Nav) --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: rgba(15, 15, 15, 0.95);
            display: flex; justify-content: center; gap: 20px;
            padding: 15px; z-index: 1000;
            border-top: 1px solid #222;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
        }

        .nav-btn {
            background: none; border: none; color: #888;
            font-size: 14px; font-weight: bold; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            transition: 0.3s;
        }
        .nav-btn:hover, .nav-btn:focus, .nav-btn.active { color: #FFD700; outline: none; }
        .nav-btn i { font-size: 24px; font-style: normal; } 

        /* --- المشغل --- */
        #player-section { display: none; }
        .player-container { width: 100%; max-width: 900px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; position: relative; padding-top: 56.25%; }
        video, iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        #ytPlayer { display: none; }
        
        .player-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 10px; background: #1a1a1a; border-radius: 8px; border: 1px solid #333; }
        .ctrl-btn { background-color: #FFD700; color: #000; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        
        /* --- قائمة المسلسل --- */
        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 15px; }
        .episode-btn {
            background-color: #1a1a1a; color: white; border: 2px solid #333; padding: 15px 5px;
            border-radius: 8px; text-align: center; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .episode-btn:hover, .episode-btn:focus { border-color: #FFD700; background-color: #333; outline: none; }

    </style>
</head>
<body>

    <!-- شاشة الترحيب -->
    <div id="splash-screen">
        <img src="63A5AFDB-C33D-4E90-8631-577AD940E645.png" alt="شعار الزعيم" class="splash-image">
        <div class="splash-title">👑 الزعيم IPTV 👑</div>
    </div>

    <!-- محتوى التطبيق -->
    <div id="app-content">
        
        <!-- المشغل (يظهر عند اختيار فيديو) -->
        <div id="player-section">
            <div class="player-container" id="playerBox">
                <video id="videoPlayer" controls autoplay></video>
                <iframe id="ytPlayer" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
            </div>
            <div class="player-controls">
                <button class="ctrl-btn" onclick="toggleFullScreen()">⛶ ملء الشاشة</button>
                <button class="ctrl-btn" style="background-color: #ff4757; color: white;" onclick="closePlayer()">✖ إغلاق</button>
            </div>
        </div>

        <!-- الأقسام (تختفي عند تشغيل فيديو) -->
        <div id="main-menu">
            <h2>📺 القنوات السورية</h2>
            <div class="poster-grid">
                
                <!-- القناة الأولى -->
                <div class="poster-card" tabindex="0" onclick="playChannel('https://svs.itworkscdn.net/syriatvlive/syriatv.smil/playlist_dvr.m3u8')">
                    <img src="https://i.imgur.com/3Vq5qJb.jpg" class="poster-img" onerror="this.src='https://via.placeholder.com/220x300/333/FFD700?text=Syria+TV'">
                    <div class="poster-title">التلفزيون السوري</div>
                </div>

                <!-- القناة الثانية -->
                <div class="poster-card" tabindex="0" onclick="playChannel('https://svs.itworkscdn.net/syriadramalive/syriadrama.smil/playlist_dvr.m3u8')">
                    <img src="https://i.imgur.com/z8G0w6x.jpg" class="poster-img" onerror="this.src='https://via.placeholder.com/220x300/333/FFD700?text=Syria+Drama'">
                    <div class="poster-title">سوريا دراما</div>
                </div>

                <!-- القناة الثالثة -->
                <div class="poster-card" tabindex="0" onclick="playChannel('https://svs.itworkscdn.net/syrianews/syrianews.smil/playlist_dvr.m3u8')">
                    <img src="https://i.imgur.com/7p4n5r2.jpg" class="poster-img" onerror="this.src='https://via.placeholder.com/220x300/333/FFD700?text=Syria+News'">
                    <div class="poster-title">الأخبارية السورية</div>
                </div>

            </div>

            <h2>🎬 مسلسل الإمام أحمد بن حنبل</h2>
            <div class="poster-grid" style="grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));">
                <!-- تم توليد 30 زر للحلقات -->
                <script>
                    for(let i=1; i<=30; i++) {
                        document.write(`
                        <div class="episode-btn" tabindex="0" onclick="playYouTube('${getYoutubeId(i)}')">
                            الحلقة ${i}
                        </div>`);
                    }
                    
                    function getYoutubeId(ep) {
                        const ids = ["rAOJZMPjxLc","e8jh0NfoUxQ","nN5A1RGBF3c","UI6qR865ehg","8NJE5yb_lqw","g5FrTDkth1I","_9Q7Nf1Ui7Q","zNcIpZu5Yhw","AAMwQCeeVZI","dDHnvmGSemw","AjS0rtLjX8A","dAtMZ-U9taA","EtE8uK22X-w","qsNdkdS81Q0","8I5TxMoAcOQ","5pPYjrfbkuw","ty516Uh3xP8","P82rEDYDozU","tq_SBbmJJ8A","d1fns8LG3uo","V6yPHEXN1fg","VtJuAWosqM4","hNXkpfyPi_Q","zCJWST2u6Vw","E41YElDToHw","JHgGELihZjs","ofkmmFBkx4o","4thw1O2Ql-k","D-eeoZP5Ido","RDPSiRV4TxY"];
                        return ids[ep-1];
                    }
                </script>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="showMainMenu()">
            <i>🏠</i> الرئيسية
        </button>
        <button class="nav-btn" onclick="alert('سيتم إضافة المزيد من الأفلام قريباً!');">
            <i>🎬</i> أفلام
        </button>
        <button class="nav-btn" onclick="alert('يمكنك إضافة قنواتك الخاصة هنا!');">
            <i>📺</i> القنوات
        </button>
        <button class="nav-btn" onclick="alert('الإعدادات');">
            <i>⚙️</i> إعدادات
        </button>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const ytPlayer = document.getElementById('ytPlayer');
        const playerSection = document.getElementById('player-section');
        const mainMenu = document.getElementById('main-menu');
        const playerBox = document.getElementById('playerBox');

        // إخفاء شاشة الترحيب
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.getElementById('app-content').style.display = 'block';
                }, 1000); 
            }, 2500); 
        });

        // إظهار المشغل وإخفاء القوائم
        function showPlayer() {
            playerSection.style.display = 'block';
            mainMenu.style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // إغلاق المشغل والعودة للقائمة
        function closePlayer() {
            video.pause();
            video.src = "";
            ytPlayer.src = "";
            playerSection.style.display = 'none';
            mainMenu.style.display = 'block';
        }

        // العودة للرئيسية من شريط التنقل
        function showMainMenu() {
            closePlayer();
        }

        function playChannel(url) {
            showPlayer();
            ytPlayer.style.display = 'none';
            video.style.display = 'block';
            video.src = url;
            video.play();
        }

        function playYouTube(videoId) {
            if(!videoId) return; 
            showPlayer();
            video.style.display = 'none';
            video.pause(); 
            ytPlayer.style.display = 'block';
            ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (playerBox.requestFullscreen) playerBox.requestFullscreen();
                else if (playerBox.webkitRequestFullscreen) playerBox.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // --- التمرير التلقائي بالريموت ---
        document.addEventListener('focusin', function(e) {
            if (e.target.classList.contains('poster-card') || e.target.classList.contains('episode-btn')) {
                e.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    </script>
</body>
</html>
