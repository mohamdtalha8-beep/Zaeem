<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزعيم - IPTV</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('IMG_6458.jpeg'); 
            background-color: #1a1a1a; 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px 10px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); 
            z-index: -1;
        }

        h1 { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); font-size: 28px; margin-bottom: 5px; }
        p.subtitle { color: #aaa; margin-top: 0; margin-bottom: 20px; }
        
        .player-container {
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            border: 2px solid #333;
            position: relative;
            padding-top: 56.25%;
        }

        video, iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        #ytPlayer { display: none; }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
        }

        .channel-btn {
            background-color: rgba(30, 30, 30, 0.9);
            color: white;
            border: 1px solid #444;
            padding: 15px 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .channel-btn:hover, .channel-btn.active {
            background-color: #FFD700;
            color: #000;
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
        }

        /* تصميم القائمة المنسدلة للمسلسل */
        .series-select {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #FFD700;
            background-color: #222;
            color: white;
            width: 90%;
            max-width: 400px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>👑 الزعيم IPTV 👑</h1>
    
    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
        <iframe id="ytPlayer" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- قسم القنوات المباشرة -->
    <h2 style="color: #FFD700; margin-top: 20px;">📺 القنوات المباشرة</h2>
    <div class="channels-grid">
        <button class="channel-btn" onclick="playChannel('https://svs.itworkscdn.net/syriatvlive/syriatv.smil/playlist_dvr.m3u8', this)">التلفزيون السوري</button>
        <button class="channel-btn" onclick="playChannel('https://svs.itworkscdn.net/syriadramalive/syriadrama.smil/playlist_dvr.m3u8', this)">سوريا دراما</button>
        <button class="channel-btn" onclick="playChannel('https://live-hls-web-aja.getaj.net/AJA/01.m3u8', this)">الجزيرة</button>
    </div>

    <!-- قسم المسلسل -->
    <h2 style="color: #FFD700; margin-top: 30px;">🎬 مسلسل الإمام أحمد بن حنبل</h2>
    <p style="color: #aaa; font-size: 14px;">اختر الحلقة من القائمة للمشاهدة</p>
    
    <select class="series-select" id="seriesSelect" onchange="playYouTube(this.value)">
        <option value="" disabled selected>-- اختر الحلقة --</option>
        <option value="kYt1w0f7V0o">الحلقة 1</option>
        <option value="2p1b6sVq7F4">الحلقة 2</option>
        <option value="gK2s9Vq7F4A">الحلقة 3</option>
        <option value="L4p1b6sVq7F">الحلقة 4</option>
        <option value="R8x2T5yW9q">الحلقة 5</option>
        <option value="M3n7B1vC5x">الحلقة 6</option>
        <option value="P9j4K2wL6z">الحلقة 7</option>
        <option value="T5y8R1wN4m">الحلقة 8</option>
        <option value="B2v6M9xQ3p">الحلقة 9</option>
        <option value="H7k3L8wJ5r">الحلقة 10</option>
        <option value="V1n5T9yC7s">الحلقة 11</option>
        <option value="F4w8P2mK6d">الحلقة 12</option>
        <option value="J9x3R7vB1q">الحلقة 13</option>
        <option value="N6m1K5wT8z">الحلقة 14</option>
        <option value="Q2p7L4yV9x">الحلقة 15</option>
        <option value="W8k3J6mR2n">الحلقة 16</option>
        <option value="C5v9T1pL4w">الحلقة 17</option>
        <option value="Y3r7M2xK8b">الحلقة 18</option>
        <option value="D1w6P5vJ3m">الحلقة 19</option>
        <option value="Z9x2R8yT5k">الحلقة 20</option>
        <option value="G4m8K3wL7p">الحلقة 21</option>
        <option value="S7v1T6yB9x">الحلقة 22</option>
        <option value="K5p9L4mN2w">الحلقة 23</option>
        <option value="X2y8R3vJ6t">الحلقة 24</option>
        <option value="A6w1M7xK4p">الحلقة 25</option>
        <option value="E9v5T2yL8n">الحلقة 26</option>
        <option value="U3m7K1wR5x">الحلقة 27</option>
        <option value="I8p4L9vN3b">الحلقة 28</option>
        <option value="O1x6R2yT7m">الحلقة 29</option>
        <option value="Y5w9K3vJ1p">الحلقة 30</option>
    </select>

    <script>
        const video = document.getElementById('videoPlayer');
        const ytPlayer = document.getElementById('ytPlayer');
        
        // دالة تشغيل القنوات
        function playChannel(url, btnElement) {
            ytPlayer.style.display = 'none';
            video.style.display = 'block';
            video.src = url;
            video.play();
            
            // إزالة التحديد عن الأزرار الأخرى
            const buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
        }

        // دالة تشغيل فيديوهات يوتيوب (المسلسل)
        function playYouTube(videoId) {
            if(!videoId) return; // إذا لم يتم اختيار شيء
            
            video.style.display = 'none';
            video.pause(); // إيقاف القناة المباشرة إذا كانت تعمل
            ytPlayer.style.display = 'block';
            // إضافة &mute=0 لضمان تشغيل الصوت
            ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            
            // إزالة التحديد الذهبي عن أزرار القنوات
            const buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
        }
        
        // عند اختيار قناة، نرجع القائمة المنسدلة للخيار الافتراضي
        document.querySelectorAll('.channel-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('seriesSelect').selectedIndex = 0;
            });
        });
    </script>
</body>
</html>
