<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#060914">
<title>الزعيم IPTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--bg:#060914;--s1:#101528;--s2:#1a2244;--line:rgba(255,255,255,.1);--gold:#f0bd4a;--gold2:#ffe29a;--txt:#f5f3ee;--mut:#9aa3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
html{font-size:16px;height:100%}
html.tv{font-size:22px}
body{height:100%;overflow:hidden;color:var(--txt);background:radial-gradient(ellipse at 70% -5%,rgba(40,90,220,.3),transparent 55%),radial-gradient(ellipse at 5% 105%,rgba(240,189,74,.09),transparent 45%),var(--bg)}
::-webkit-scrollbar{width:0;height:0}
button{color:inherit}

#splash-screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle,#101a3d,#000 72%);transition:opacity .8s}
.splash-logo{width:150px;border-radius:24px;filter:drop-shadow(0 0 30px rgba(240,189,74,.45))}
.splash-title{margin-top:1.2rem;color:var(--gold);font-size:2.2rem;font-weight:900}

#app{display:none;height:100%;flex-direction:column}
#app.show{display:flex}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 2rem .3rem}
.brand{color:var(--gold);font-size:1.5rem;font-weight:900}
.search-box{width:22rem;max-width:100%;padding:.7rem 1.3rem;font-size:1rem;color:var(--txt);background:rgba(16,21,40,.9);border:1px solid var(--line);border-radius:999px;outline:none}
.search-box::placeholder{color:var(--mut)}
.search-box:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,189,74,.28)}
#view{flex:1;min-height:0;overflow-y:auto;padding:.4rem 0 1rem;scroll-behavior:smooth}

.row{margin-bottom:.8rem}
.row h2{padding:0 2rem;font-size:1.25rem;font-weight:900}
.rail{display:flex;gap:1rem;overflow-x:auto;padding:.9rem 2rem 1.1rem;scroll-behavior:smooth}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:1.3rem 1rem;padding:.9rem 2rem 1rem}
.card{flex:0 0 auto;width:11rem;text-align:center;cursor:pointer;outline:none;border-radius:14px;transition:transform .18s}
.card.ep{width:15rem}
.grid .card,.grid .card.ep{width:auto}
.thumb{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:16/10;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,var(--s2),var(--s1));transition:box-shadow .18s,border-color .18s}
.card.ep .thumb{aspect-ratio:16/9}
.thumb img{width:62%;height:72%;object-fit:contain}
.thumb img.cover{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;right:.45rem;bottom:.45rem;padding:.1rem .65rem;border-radius:999px;background:rgba(0,0,0,.72);color:var(--gold2);font-size:.75rem;font-weight:700}
.card.live .thumb::after{content:'';position:absolute;top:.5rem;right:.5rem;width:.55rem;height:.55rem;border-radius:50%;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}
.cname{margin-top:.5rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#dfe3ee;font-size:.9rem;font-weight:700}
.card:hover .thumb{border-color:var(--gold)}
.card:focus{transform:scale(1.08);z-index:3}
.card:focus .thumb{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 14px 34px rgba(240,189,74,.3)}

.card.poster{width:9rem}
.card.poster .thumb{aspect-ratio:2/3}
.card.poster .thumb img{width:100%;height:100%;object-fit:cover}
.grid .card.poster{width:auto}
.settings{padding:1rem 2rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem 2rem}
.chip{flex:0 0 auto;padding:.55rem 1.2rem;border:1px solid var(--line);border-radius:999px;background:var(--s1);font-size:.95rem;font-weight:700;color:var(--mut);cursor:pointer;outline:none}
.chip.active{background:rgba(240,189,74,.16);border-color:var(--gold);color:var(--gold)}
.chip:focus{background:var(--gold);border-color:var(--gold);color:#14100a;box-shadow:0 0 0 3px rgba(240,189,74,.35)}
.empty{padding:3rem 2rem;text-align:center;color:var(--gold);font-size:1.1rem;font-weight:700}
.more-btn{display:block;margin:0 auto 1rem;padding:.7rem 1.6rem;border:1px solid var(--line);border-radius:999px;background:var(--s2);font-size:.95rem;font-weight:700;cursor:pointer;outline:none}
.more-btn:focus{background:var(--gold);color:#14100a}

.dock{align-self:center;display:flex;gap:.3rem;padding:.35rem;margin:.3rem 0 max(.7rem,env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:999px;background:rgba(12,17,38,.95)}
.dock button{display:flex;align-items:center;gap:.5rem;padding:.7rem 1.5rem;border:0;border-radius:999px;background:transparent;color:var(--mut);font-size:1rem;font-weight:700;cursor:pointer;outline:none}
.dock button.active{background:rgba(240,189,74,.16);color:var(--gold)}
.dock button:focus{background:var(--gold);color:#14100a;box-shadow:0 0 0 3px rgba(240,189,74,.35)}
html.tv .dock button{padding:.4rem 1.2rem;font-size:.75rem}

#player{position:fixed;inset:0;z-index:100;display:none;background:#000}
#player.open{display:block}
#player video,#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
#ytPlayer{display:none}
#hud{position:absolute;top:1rem;left:50%;max-width:60%;padding:.4rem 1.4rem;transform:translateX(-50%);border-radius:999px;background:rgba(0,0,0,.7);color:var(--gold2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;transition:opacity .3s;z-index:2}
#hud.on{opacity:1}
#closeBtn,#favBtn,.pbtn{z-index:3;padding:.55rem 1.3rem;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.65);font-size:.95rem;font-weight:700;cursor:pointer;outline:none}
#closeBtn,#favBtn{position:absolute}
#closeBtn{top:1rem;right:1rem}
#favBtn{top:1rem;left:1rem}
#favBtn.on{color:var(--gold)}
#ytBar{display:none;position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);gap:.6rem;z-index:3}
#closeBtn:focus,#favBtn:focus,.pbtn:focus{background:var(--gold);color:#14100a}

html.tv .top,html.tv .row h2{padding-right:2.6rem;padding-left:2.6rem}
html.tv .rail,html.tv .grid,html.tv .chips{padding-right:2.6rem;padding-left:2.6rem}

@media(max-width:800px){
  html{font-size:15px}
  .top{flex-direction:column;align-items:stretch;gap:.6rem;padding:max(.8rem,env(safe-area-inset-top)) 1rem .3rem}
  .brand{text-align:center}
  .search-box{width:100%}
  .row h2,.rail,.grid,.chips{padding-right:1rem;padding-left:1rem}
  .card{width:8.6rem}.card.poster{width:7.6rem}.card.ep{width:12rem}
  .grid{grid-template-columns:repeat(3,1fr);gap:1rem .6rem}
  .dock{width:calc(100% - 1.4rem);justify-content:space-around}
  .dock button{flex:1;justify-content:center;padding:.6rem .15rem;font-size:.75rem;gap:.2rem}
  #hud{max-width:40%;font-size:.8rem;top:3.6rem}
}
@media(max-width:400px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="splash-screen">
  <img src="63A5AFDB-C33D-4E90-8631-577AD940E645.png" alt="" class="splash-logo" onerror="this.style.display='none'">
  <div class="splash-title">👑 الزعيم IPTV 👑</div>
</div>

<div id="app">
  <div class="top">
    <div class="brand">👑 الزعيم IPTV</div>
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن قناة..." readonly inputmode="search" enterkeyhint="search" autocomplete="off">
  </div>
  <div id="view"></div>
  <nav class="dock" id="dock">
    <button data-v="home">🏠 الرئيسية</button>
    <button data-v="channels">📺 القنوات</button>
    <button data-v="movies">🎬 أفلام</button>
    <button data-v="series">📼 مسلسلات</button>
    <button data-v="settings">⚙️ إعدادات</button>
  </nav>
</div>

<div id="player">
  <video id="videoPlayer" controls autoplay playsinline></video>
  <iframe id="ytPlayer" allow="autoplay; encrypted-media; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="hud"></div>
  <button id="closeBtn">✕ رجوع</button>
  <button id="favBtn">☆ مفضلة</button>
  <div id="ytBar">
    <button class="pbtn" id="ytPlay">▶ تشغيل</button>
    <button class="pbtn" id="ytOpen">↗ فتح في تطبيق يوتيوب</button>
  </div>
</div>

<script>
(function(){
  const q = new URLSearchParams(location.search).get('tv');
  const auto = /TV|Tizen|Web0S|AFT|BRAVIA|SMART|Android(?!.*Mobile)/i.test(navigator.userAgent);
  if (q === '1' || (q === null && auto)) document.documentElement.classList.add('tv');
})();

const $ = id => document.getElementById(id);
const video = $('videoPlayer'), ytPlayer = $('ytPlayer'), viewEl = $('view'), searchInput = $('searchInput'),
      dock = $('dock'), playerEl = $('player'), hud = $('hud'), favBtn = $('favBtn'),
      ytBar = $('ytBar'), ytPlay = $('ytPlay'), ytOpen = $('ytOpen');

const PAGE = 60;
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="70" height="70"><rect width="70" height="70" rx="12" fill="#1a2244"/><text x="35" y="43" font-size="22" font-weight="bold" text-anchor="middle" fill="#f0bd4a" font-family="sans-serif">TV</text></svg>');

const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let allChannels = [], shown = PAGE, nextId = 0, hls = null, idx = null;
let view = 'home', cat = 'all', q = '';
let currentId = -1, curList = [], curIdx = 0, lastFocus = null, hudTimer = 0, ytTimer = 0, favDirty = false;
let favs = store.get('zaeemFav', []), recent = store.get('zaeemRecent', []);
const byUrl = new Map();

const categories = [
  {id:'all',name:'🏠 الرئيسية'},{id:'fav',name:'⭐ المفضلة'},{id:'سوريا',name:'🇸🇾 سوريا'},{id:'mbc',name:'MBC'},
  {id:'أخبار',name:'📰 أخبار'},{id:'رياضة',name:'⚽ رياضة'},{id:'أفلام',name:'🎬 أفلام'},{id:'مسلسلات',name:'📺 مسلسلات'},
  {id:'أطفال',name:'🧸 أطفال'},{id:'دينية',name:'🕌 دينية'},{id:'موسيقى',name:'🎵 موسيقى'},{id:'منوعة',name:'🌟 منوعة'}
];

const epIds = ["rAOJZMPjxLc","e8jh0NfoUxQ","nN5A1RGBF3c","UI6qR865ehg","8NJE5yb_lqw","g5FrTDkth1I","_9Q7Nf1Ui7Q","zNcIpZu5Yhw","AAMwQCeeVZI","dDHnvmGSemw","AjS0rtLjX8A","dAtMZ-U9taA","EtE8uK22X-w","qsNdkdS81Q0","8I5TxMoAcOQ","5pPYjrfbkuw","ty516Uh3xP8","P82rEDYDozU","tq_SBbmJJ8A","d1fns8LG3uo","V6yPHEXN1fg","VtJuAWosqM4","hNXkpfyPi_Q","zCJWST2u6Vw","E41YElDToHw","JHgGELihZjs","ofkmmFBkx4o","4thw1O2Ql-k","D-eeoZP5Ido","RDPSiRV4TxY"];
const episodes = epIds.map((id, i) => ({
  yt: id, name: 'الحلقة ' + (i + 1) + (i === epIds.length - 1 ? ' (الأخيرة)' : ''),
  thumb: 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg'
}));

const epIds_baqla = ["6Q3LHKD-OQE", "G6scQ2IHiHc", "Sk3uDpQRu6w", "AM6qKx3kyTE", "_5pWUphmekU"];
const episodes_baqla = epIds_baqla.map((id, i) => ({
  yt: id, name: 'بقلة ذوق - الحلقة ' + (i + 1),
  thumb: 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg'
}));

const baseChannels = [
  {name:"التلفزيون السوري",url:"https://svs.itworkscdn.net/syriatvlive/syriatv.smil/playlist_dvr.m3u8",logo:"https://upload.wikimedia.org/wikipedia/ar/thumb/1/1a/Syria_TV_logo.png/200px-Syria_TV_logo.png",cat:"سوريا"},
  {name:"سوريا دراما",url:"https://svs.itworkscdn.net/syriadramalive/syriadrama.smil/playlist_dvr.m3u8",logo:"https://upload.wikimedia.org/wikipedia/ar/thumb/9/9f/Syria_Drama_logo.png/200px-Syria_Drama_logo.png",cat:"سوريا"},
  {name:"الأخبارية السورية",url:"https://svs.itworkscdn.net/syrianews/syrianews.smil/playlist_dvr.m3u8",logo:"https://upload.wikimedia.org/wikipedia/ar/thumb/e/e1/Syria_News_logo.png/200px-Syria_News_logo.png",cat:"سوريا"}
];

const VOD = ['أفلام', 'مسلسلات'];
const isFav = u => favs.some(f => f.url === u);

function addChannels(list) {
  list.forEach(c => {
    if (!byUrl.has(c.url)) { c.id = nextId++; byUrl.set(c.url, c); allChannels.push(c); idx = null; }
  });
}

function byCat(id) {
  if (id === 'fav') return favs.map(f => byUrl.get(f.url)).filter(Boolean);
  if (!idx) { idx = {}; allChannels.forEach(c => (idx[c.cat] || (idx[c.cat] = [])).push(c)); }
  return idx[id] || [];
}

let renderTimer = 0;
function scheduleRender() {
  if (renderTimer) return;
  renderTimer = setTimeout(() => {
    renderTimer = 0;
    if (!viewEl.contains(document.activeElement)) render();
  }, 300);
}

window.addEventListener('load', () => {
  addChannels(baseChannels);
  addChannels(favs.map(f => ({...f})));
  addChannels(recent.map(f => ({...f})));
  render();
  loadAllPlaylists();
  setTimeout(() => {
    const sp = $('splash-screen');
    $('app').classList.add('show');
    sp.style.opacity = '0';
    setTimeout(() => sp.remove(), 800);
    const first = viewEl.querySelector('.card') || dock.querySelector('.active');
    if (first) first.focus();
    autoStart();
  }, 1500);
});

function autoStart() {
  if (!autoOn()) return;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('zaeemLast')); } catch (e) {}
  if (saved && saved.url) addChannels([saved]);
  const ch = (saved && byUrl.get(saved.url)) || allChannels[0];
  if (ch) play(ch, allChannels.filter(c => c.cat === ch.cat));
}

function loadAllPlaylists() {
  const lists = [
    {url:"https://iptv-org.github.io/iptv/countries/sy.m3u",cat:'سوريا'},
    {url:"https://iptv-org.github.io/iptv/languages/ara.m3u",cat:'منوعة'},
    {url:"https://iptv-org.github.io/iptv/categories/movies.m3u",cat:'أفلام'}
  ];
  lists.forEach(p =>
    fetch(p.url, {cache:'no-store'}).then(r => r.text())
      .then(t => { addChannels(parseM3U(t, p.cat)); scheduleRender(); })
      .catch(() => console.log('فشل جلب: ' + p.url))
  );
}

function parseM3U(text, defaultCat) {
  const out = [];
  let name = '', logo = '', group = '';
  text.split('\n').forEach(raw => {
    const line = raw.trim();
    if (line.startsWith('#EXTINF:')) {
      const l = line.match(/tvg-logo="([^"]*)"/), g = line.match(/group-title="([^"]*)"/);
      logo = l && l[1] ? l[1] : '';
      group = g ? g[1] : '';
      const c = line.lastIndexOf(',');
      name = c !== -1 ? line.substring(c + 1).trim() : '';
    } else if (/^https?:\/\//i.test(line) && name) {
      let cat = defaultCat;
      const lg = group.toLowerCase();
      if (/mbc/i.test(name)) cat = 'mbc';
      else if (lg.includes('news') || name.includes('أخبار') || name.includes('إخبار')) cat = 'أخبار';
      else if (lg.includes('sport') || name.includes('رياض') || /bein/i.test(name)) cat = 'رياضة';
      else if (lg.includes('kid') || lg.includes('animation') || name.includes('أطفال') || name.includes('كرتون')) cat = 'أطفال';
      else if (lg.includes('relig') || name.includes('قرآن') || name.includes('إسلام')) cat = 'دينية';
      else if (lg.includes('music') || name.includes('أغاني') || name.includes('موسيقى')) cat = 'موسيقى';
      else if (/series|مسلسل|S\d{1,2}\s?E\d{1,2}/i.test(group + ' ' + name)) cat = 'مسلسلات';
      else if (lg.includes('movie') || name.includes('أفلام')) cat = 'أفلام';
      out.push({name, url: line, logo: /^https?:\/\//i.test(logo) ? logo : '', cat});
      name = ''; logo = ''; group = '';
    }
  });
  return out;
}

function chCard(ch, list) {
  const d = document.createElement('div');
  d.className = 'card' + (ch.id === currentId ? ' live' : '') + (VOD.includes(ch.cat) ? ' poster' : '');
  d.tabIndex = 0;
  const t = document.createElement('div');
  t.className = 'thumb';
  const img = new Image();
  img.alt = ''; img.loading = 'lazy';
  img.src = ch.logo || PLACEHOLDER;
  img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER; };
  t.appendChild(img);
  const n = document.createElement('div');
  n.className = 'cname'; n.textContent = (isFav(ch.url) ? '⭐ ' : '') + ch.name; n.title = ch.name;
  d.append(t, n);
  d.onclick = () => play(ch, list);
  return d;
}

function epCard(ep, list) {
  const d = document.createElement('div');
  d.className = 'card ep';
  d.tabIndex = 0;
  const t = document.createElement('div');
  t.className = 'thumb';
  const img = new Image();
  img.alt = ''; img.loading = 'lazy'; img.className = 'cover';
  img.src = ep.thumb;
  img.onerror = () => { img.style.display = 'none'; };
  const b = document.createElement('span');
  b.className = 'badge'; b.textContent = '▶';
  t.append(img, b);
  const n = document.createElement('div');
  n.className = 'cname'; n.textContent = ep.name;
  d.append(t, n);
  d.onclick = () => play(ep, list);
  return d;
}

function addRow(title, items, mk) {
  if (!items.length) return;
  const s = document.createElement('section');
  s.className = 'row';
  const h = document.createElement('h2');
  h.textContent = title;
  const rail = document.createElement('div');
  rail.className = 'rail';
  items.forEach(it => rail.appendChild(mk(it, items)));
  s.append(h, rail);
  viewEl.appendChild(s);
}

function filteredChannels() {
  const s = q.toLowerCase();
  return allChannels.filter(c =>
    (cat === 'all' ? (s || !VOD.includes(c.cat)) : cat === 'fav' ? isFav(c.url) : c.cat === cat) &&
    c.name.toLowerCase().includes(s));
}

function showGrid(list, mk, emptyText) {
  if (!list.length) {
    if (emptyText) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = emptyText;
      viewEl.appendChild(e);
    }
    return;
  }
  const g = document.createElement('div');
  g.className = 'grid';
  list.slice(0, shown).forEach(c => g.appendChild(mk(c, list)));
  viewEl.appendChild(g);
  if (list.length > shown) {
    const m = document.createElement('button');
    m.className = 'more-btn';
    m.textContent = 'عرض المزيد (' + (list.length - shown) + ' متبقية)';
    m.onclick = () => { shown += PAGE; render(); };
    viewEl.appendChild(m);
  }
}

function autoOn() { try { return localStorage.getItem('zaeemAuto') !== '0'; } catch (e) { return true; } }

function render() {
  viewEl.textContent = '';
  dock.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.v === view));
  if (view === 'home') {
    addRow('🕘 تابع المشاهدة', recent.map(r => byUrl.get(r.url)).filter(Boolean), chCard);
    addRow('⭐ المفضلة', byCat('fav'), chCard);
    addRow('🎬 أحدث الأفلام', byCat('أفلام').slice(0, 20), chCard);
    addRow('📺 أحدث المسلسلات', byCat('مسلسلات').slice(0, 20), chCard);
    addRow('🎬 مسلسل الإمام أحمد بن حنبل', episodes, epCard);
    addRow('🎬 مسلسل بقلة ذوق وكثرة غلبة', episodes_baqla, epCard);
    categories.slice(1).forEach(c => {
      if (c.id !== 'fav' && !VOD.includes(c.id)) addRow(c.name, byCat(c.id).slice(0, 20), chCard);
    });
  } else if (view === 'channels') {
    const chips = document.createElement('div');
    chips.className = 'chips';
    categories.filter(c => !VOD.includes(c.id)).forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip' + (c.id === cat ? ' active' : '');
      b.textContent = c.name;
      b.onclick = () => {
        cat = c.id; shown = PAGE; render();
        const a = viewEl.querySelector('.chip.active'); if (a) a.focus();
      };
      chips.appendChild(b);
    });
    viewEl.appendChild(chips);
    showGrid(filteredChannels(), chCard,
      cat === 'fav' ? 'لا توجد قنوات مفضلة بعد — افتح قناة واضغط «مفضلة»' :
      allChannels.length ? 'لا توجد نتائج مطابقة' : 'جاري جلب القنوات...');
  } else if (view === 'movies') {
    showGrid(byCat('أفلام'), chCard, 'جاري جلب الأفلام...');
  } else if (view === 'series') {
    addRow('🎬 مسلسل الإمام أحمد بن حنبل', episodes, epCard);
    addRow('🎬 مسلسل بقلة ذوق وكثرة غلبة', episodes_baqla, epCard);
    showGrid(byCat('مسلسلات'), chCard);
  } else {
    const st = document.createElement('div');
    st.className = 'settings';
    const b = document.createElement('button');
    b.className = 'more-btn';
    const label = () => 'فتح آخر قناة تلقائياً عند التشغيل: ' + (autoOn() ? 'مفعّل ✅' : 'متوقف ⛔');
    b.textContent = label();
    b.onclick = () => { try { localStorage.setItem('zaeemAuto', autoOn() ? '0' : '1'); } catch (e) {} b.textContent = label(); };
    const r = document.createElement('button');
    r.className = 'more-btn';
    r.textContent = '🗑️ مسح سجل المشاهدة';
    r.onclick = () => { recent = []; store.set('zaeemRecent', recent); r.textContent = 'تم المسح ✅'; };
    st.append(b, r);
    viewEl.appendChild(st);
  }
}

dock.querySelectorAll('button').forEach(b => b.onclick = () => {
  view = b.dataset.v;
  if (view === 'home') { q = ''; searchInput.value = ''; cat = 'all'; }
  shown = PAGE;
  render();
  viewEl.scrollTo({top: 0});
});

/* ---------- البحث: لا يفتح الكيبورد إلا عند الضغط ---------- */
let opening = false, searchTimer = 0;
function openSearch() {
  opening = true;
  searchInput.readOnly = false;
  searchInput.blur();
  searchInput.focus();
  opening = false;
}
searchInput.addEventListener('click', openSearch);
searchInput.addEventListener('blur', () => { if (!opening) searchInput.readOnly = true; });
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (searchInput.readOnly) openSearch(); else searchInput.blur();
  }
});
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    q = searchInput.value.trim();
    if (q) view = 'channels';
    shown = PAGE;
    render();
  }, 250);
});

function stopYouTube() { clearTimeout(ytTimer); ytPlayer.src = 'about:blank'; ytPlayer.style.display = 'none'; ytBar.style.display = 'none'; }
function stopHls() { if (hls) { hls.destroy(); hls = null; } }

function showHud(text, sticky) {
  hud.textContent = text;
  hud.classList.add('on');
  clearTimeout(hudTimer);
  if (!sticky) hudTimer = setTimeout(() => hud.classList.remove('on'), 4000);
}

/* ---------- يوتيوب على التلفاز ---------- */
function ytCmd(f) {
  try { ytPlayer.contentWindow.postMessage(JSON.stringify({event:'command', func:f, args:[]}), '*'); } catch (e) {}
}
ytPlay.onclick = () => { ytCmd('playVideo'); showHud('جاري التشغيل...'); };

function openInYouTube() {
  const it = curList[curIdx];
  if (!it || !it.yt) return;
  const web = 'https://www.youtube.com/watch?v=' + it.yt;
  if (/Android/i.test(navigator.userAgent)) {
    const pkg = document.documentElement.classList.contains('tv') ? 'com.google.android.youtube.tv' : 'com.google.android.youtube';
    location.href = 'intent://www.youtube.com/watch?v=' + it.yt + '#Intent;scheme=https;package=' + pkg +
      ';S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
  } else {
    window.open(web, '_blank');
  }
}
ytOpen.onclick = openInYouTube;

ytPlayer.addEventListener('load', () => {
  if (ytPlayer.src.indexOf('/embed/') === -1) return;
  try { ytPlayer.contentWindow.postMessage(JSON.stringify({event:'listening', id:1, channel:'widget'}), '*'); } catch (e) {}
  setTimeout(() => ytCmd('playVideo'), 1500);
});

window.addEventListener('message', e => {
  if (e.source !== ytPlayer.contentWindow) return;
  let d = e.data;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch (x) { return; } }
  if (!d) return;
  if (d.event === 'onError') {
    clearTimeout(ytTimer);
    showHud('⚠️ يوتيوب لا يسمح بتشغيل هذه الحلقة هنا — اضغط «فتح في تطبيق يوتيوب»', true);
    ytOpen.focus();
  } else if ((d.event === 'onStateChange' && d.info === 1) || (d.event === 'infoDelivery' && d.info && d.info.playerState === 1)) {
    clearTimeout(ytTimer);
    const it = curList[curIdx]; if (it) showHud(it.name);
  }
});

function updateFav(it) {
  favBtn.style.display = it.yt ? 'none' : 'block';
  const on = !it.yt && isFav(it.url);
  favBtn.classList.toggle('on', on);
  favBtn.textContent = on ? '⭐ في المفضلة' : '☆ مفضلة';
}

function toggleFav() {
  const it = curList[curIdx];
  if (!it || it.yt) return;
  const i = favs.findIndex(f => f.url === it.url);
  if (i >= 0) favs.splice(i, 1);
  else favs.push({name: it.name, url: it.url, logo: it.logo, cat: it.cat});
  store.set('zaeemFav', favs);
  favDirty = true;
  updateFav(it);
  showHud(i >= 0 ? 'أُزيلت من المفضلة' : '⭐ أضيفت للمفضلة');
}
favBtn.onclick = toggleFav;

function pushRecent(ch) {
  recent = [{name: ch.name, url: ch.url, logo: ch.logo, cat: ch.cat}]
    .concat(recent.filter(r => r.url !== ch.url)).slice(0, 12);
  store.set('zaeemRecent', recent);
}

function play(item, list) {
  if (!playerEl.classList.contains('open')) lastFocus = document.activeElement;
  playerEl.classList.add('open');
  $('closeBtn').focus();
  curList = list;
  curIdx = Math.max(0, list.indexOf(item));
  stopHls();
  clearTimeout(ytTimer);
  updateFav(item);

  if (item.yt) {
    video.pause();
    video.style.display = 'none';
    ytPlayer.style.display = 'block';
    ytBar.style.display = 'flex';
    ytPlay.focus();

    // تشغيل الحلقة التالية تلقائياً (كما كان تماماً)
    let playlist = curList.map(e => e.yt).join(',');
    let currentIndex = curIdx;
    const org = /^https?:/.test(location.origin) ? '&origin=' + encodeURIComponent(location.origin) : '';
    ytPlayer.src = `https://www.youtube.com/embed/${item.yt}?autoplay=1&rel=0&playlist=${playlist}&index=${currentIndex}&enablejsapi=1&playsinline=1${org}`;

    showHud(item.name);
    // إن لم يبدأ الفيديو خلال 9 ثوانٍ نعرض تلميحاً
    ytTimer = setTimeout(() => {
      showHud('اضغط OK على «تشغيل» أو افتحه في تطبيق يوتيوب', true);
    }, 9000);
    return;
  }

  currentId = item.id;
  try { localStorage.setItem('zaeemLast', JSON.stringify({name:item.name,url:item.url,logo:item.logo,cat:item.cat})); } catch (e) {}
  pushRecent(item);
  stopYouTube();
  video.style.display = 'block';
  video.pause();

  let url = item.url;
  if (location.protocol === 'https:' && url.startsWith('http:')) url = 'https:' + url.slice(5);

  showHud('جاري التحميل... ' + item.name, true);
  const fail = () => showHud('⚠️ القناة لا تعمل حالياً: ' + item.name + ' — اضغط ▼ للقناة التالية', true);
  const ok = () => showHud(item.name);

  if (window.Hls && Hls.isSupported() && url.includes('.m3u8')) {
    hls = new Hls();
    const h = hls;
    h.loadSource(url);
    h.attachMedia(video);
    h.on(Hls.Events.MANIFEST_PARSED, () => { video.play().then(ok).catch(ok); });
    let recovered = 0;
    h.on(Hls.Events.ERROR, (e, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR && recovered++ < 2) h.recoverMediaError();
      else if (data.type === Hls.ErrorTypes.NETWORK_ERROR && recovered++ < 2) h.startLoad();
      else { h.destroy(); if (hls === h) hls = null; fail(); }
    });
  } else {
    video.src = url;
    video.play().then(ok).catch(fail);
  }
}

function zap(dir) {
  if (curList.length < 2) return;
  curIdx = (curIdx + dir + curList.length) % curList.length;
  play(curList[curIdx], curList);
}

function closePlayer() {
  stopHls(); stopYouTube();
  video.pause();
  video.removeAttribute('src');
  video.load();
  hud.classList.remove('on');
  playerEl.classList.remove('open');
  currentId = -1;
  let target = lastFocus && lastFocus.isConnected ? lastFocus : null;
  if (favDirty) { favDirty = false; target = null; render(); }
  else if (view === 'home' || view === 'channels') {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('live'));
    if (!target) render();
  }
  target = target || viewEl.querySelector('.card') || dock.querySelector('.active');
  if (target) target.focus();
}
$('closeBtn').onclick = closePlayer;

function focusables() {
  return Array.from(document.querySelectorAll('.card,.chip,.dock button,.search-box,.more-btn'))
    .filter(el => el.offsetParent !== null);
}

function spatialMove(dir) {
  const cur = document.activeElement;
  const list = focusables();
  if (!list.includes(cur)) { if (list[0]) list[0].focus(); return; }
  const r = cur.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bestScore = Infinity;
  list.forEach(el => {
    if (el === cur) return;
    const b = el.getBoundingClientRect();
    const dx = b.left + b.width / 2 - cx, dy = b.top + b.height / 2 - cy;
    let main, cross;
    if (dir === 'ArrowUp')    { if (dy >= -5) return; main = -dy; cross = Math.abs(dx); }
    if (dir === 'ArrowDown')  { if (dy <= 5)  return; main = dy;  cross = Math.abs(dx); }
    if (dir === 'ArrowLeft')  { if (dx >= -5) return; main = -dx; cross = Math.abs(dy); }
    if (dir === 'ArrowRight') { if (dx <= 5)  return; main = dx;  cross = Math.abs(dy); }
    const score = main + cross * 2.5;
    if (score < bestScore) { bestScore = score; best = el; }
  });
  if (best) { best.focus(); best.scrollIntoView({block: 'nearest', inline: 'center'}); }
}

// زر الرجوع: ويب، أندرويد (4)، Tizen (10009)، webOS (461)
const isBack = e => e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack' || e.keyCode === 4 || e.keyCode === 10009 || e.keyCode === 461;

document.addEventListener('keydown', e => {
  const t = document.activeElement;
  if (playerEl.classList.contains('open')) {
    if (e.key === 'ArrowDown' || e.key === 'ChannelDown' || e.key === 'PageDown') { e.preventDefault(); zap(1); }
    else if (e.key === 'ArrowUp' || e.key === 'ChannelUp' || e.key === 'PageUp') { e.preventDefault(); zap(-1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const bs = [$('closeBtn'), favBtn, ytPlay, ytOpen].filter(b => b.offsetParent !== null);
      if (bs.length > 1) {
        e.preventDefault();
        const i = bs.indexOf(t);
        bs[(i + (e.key === 'ArrowRight' ? 1 : -1) + bs.length) % bs.length].focus();
      }
    }
    else if (isBack(e)) { e.preventDefault(); closePlayer(); }
    return;
  }
  const typing = t && t.tagName === 'INPUT' && !t.readOnly;
  if (typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
  if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    spatialMove(e.key);
  } else if (e.key === 'Enter' && t && t.classList.contains('card')) {
    t.click();
  } else if (isBack(e)) {
    if (typing) return;
    e.preventDefault();
    const a = dock.querySelector('.active'); if (a) a.focus();
  }
});
</script>
