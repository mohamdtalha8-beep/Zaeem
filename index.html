<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#060914">
<title>الزعيم IPTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--bg:#060914;--s1:#101528;--s2:#1a2244;--line:rgba(255,255,255,.1);--gold:#f0bd4a;--gold2:#ffe29a;--txt:#f5f3ee;--mut:#9aa3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
html{font-size:16px;height:100%}
html.tv{font-size:22px}
body{height:100%;overflow:hidden;color:var(--txt);background:radial-gradient(ellipse at 70% -5%,rgba(40,90,220,.3),transparent 55%),radial-gradient(ellipse at 5% 105%,rgba(240,189,74,.09),transparent 45%),var(--bg)}
::-webkit-scrollbar{width:0;height:0}
button{color:inherit}
#view{flex:1;min-height:0;overflow-y:auto;padding:.4rem 0 1rem;scroll-behavior:smooth;transform:translateZ(0);will-change:scroll-position;contain:content}
.rail{display:flex;gap:1rem;overflow-x:auto;padding:.9rem 2rem 1.1rem;scroll-behavior:smooth;transform:translateZ(0);will-change:scroll-position;contain:content}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:1.3rem 1rem;padding:.9rem 2rem 1rem;transform:translateZ(0)}
#tv-guide{display:none;flex:1;overflow:hidden;background:#060914;margin-bottom:10px}
#tv-guide.active{display:flex}
.guide-channels{flex:1;display:flex;flex-direction:column;overflow-y:auto;border-left:1px solid var(--line);background:var(--s1)}
.guide-header{background:#0055ff;padding:12px 20px;display:flex;justify-content:space-between;font-weight:bold;color:#fff;position:sticky;top:0;z-index:2}
.guide-item{display:flex;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);cursor:pointer;outline:none;transition:background 0.1s}
.guide-item:hover,.guide-item:focus{background:#0055ff}
.guide-num{width:40px;font-weight:bold;font-size:14px;color:#ccc}
.guide-logo{width:40px;height:40px;object-fit:contain;margin:0 15px;background:rgba(255,255,255,0.05);border-radius:4px;padding:2px}
.guide-name{font-size:16px;font-weight:700}
.guide-cats{width:280px;display:flex;flex-direction:column;overflow-y:auto;background:#0a0d14}
.guide-cat-header{background:#000;padding:12px 20px;color:#fff;font-weight:bold;display:flex;justify-content:space-between;position:sticky;top:0;z-index:2}
.guide-cat{padding:12px 20px;border-bottom:1px solid var(--line);cursor:pointer;outline:none;color:var(--mut);font-weight:700;display:flex;align-items:center}
.guide-cat:hover,.guide-cat:focus{background:#1a2235;color:#fff}
.guide-cat.active{background:#0055ff;color:#fff}
#splash-screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle,#101a3d,#000 72%);transition:opacity .4s}
.splash-logo{width:150px;border-radius:24px;filter:drop-shadow(0 0 30px rgba(240,189,74,.45))}
.splash-title{margin-top:1.2rem;color:var(--gold);font-size:2.2rem;font-weight:900}
.splash-ver{margin-top:.4rem;color:var(--mut);font-size:.9rem}
#app{display:none;height:100%;flex-direction:column}
#app.show{display:flex}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 2rem .3rem}
.brand{color:var(--gold);font-size:1.5rem;font-weight:900}
.search-box{width:22rem;max-width:100%;padding:.7rem 1.3rem;font-size:1rem;color:var(--txt);background:rgba(16,21,40,.9);border:1px solid var(--line);border-radius:999px;outline:none}
.search-box::placeholder{color:var(--mut)}
.search-box:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,189,74,.28)}
.row{margin-bottom:.8rem}
.row h2{padding:0 2rem;font-size:1.25rem;font-weight:900}
.card{flex:0 0 auto;width:11rem;text-align:center;cursor:pointer;outline:none;border-radius:14px;transition:transform .15s cubic-bezier(0.2, 0.8, 0.2, 1);transform:translateZ(0)}
.card.ep{width:15rem}
.grid .card,.grid .card.ep{width:auto}
.thumb{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:16/10;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,var(--s2),var(--s1));transition:box-shadow .15s,border-color .15s;transform:translateZ(0);backface-visibility:hidden}
.card.ep .thumb{aspect-ratio:16/9}
.thumb img{width:62%;height:72%;object-fit:contain;transform:translateZ(0)}
.thumb img.cover{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;right:.45rem;bottom:.45rem;padding:.1rem .65rem;border-radius:999px;background:rgba(0,0,0,.72);color:var(--gold2);font-size:.75rem;font-weight:700}
.card.live .thumb::after{content:'';position:absolute;top:.5rem;right:.5rem;width:.55rem;height:.55rem;border-radius:50%;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}
.cname{margin-top:.5rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#dfe3ee;font-size:.9rem;font-weight:700}
.card:hover .thumb{border-color:var(--gold)}
.card:focus{transform:scale(1.06) translateZ(0);z-index:3}
.card:focus .thumb{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 14px 34px rgba(240,189,74,.3)}
.card.poster{width:9rem}
.card.poster .thumb{aspect-ratio:2/3}
.card.poster .thumb img{width:100%;height:100%;object-fit:cover}
.grid .card.poster{width:auto}
.settings{padding:1rem 2rem}
.ver{padding:1rem;text-align:center;color:var(--mut);font-size:.85rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem 2rem;transform:translateZ(0)}
.chip{flex:0 0 auto;padding:.55rem 1.2rem;border:1px solid var(--line);border-radius:999px;background:var(--s1);font-size:.95rem;font-weight:700;color:var(--mut);cursor:pointer;outline:none;transition:transform .1s}
.chip.active{background:rgba(240,189,74,.16);border-color:var(--gold);color:var(--gold)}
.chip:focus{background:var(--gold);border-color:var(--gold);color:#14100a;box-shadow:0 0 0 3px rgba(240,189,74,.35)}
.empty{padding:3rem 2rem;text-align:center;color:var(--gold);font-size:1.1rem;font-weight:700}
.more-btn{display:block;margin:0 auto 1rem;padding:.7rem 1.6rem;border:1px solid var(--line);border-radius:999px;background:var(--s2);font-size:.95rem;font-weight:700;cursor:pointer;outline:none}
.more-btn:focus{background:var(--gold);color:#14100a}
.spinner-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:3rem 2rem;color:var(--gold);font-weight:700}
.spinner{width:3rem;height:3rem;border:4px solid rgba(240,189,74,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-bar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:200% 100%;animation:slide 1.2s linear infinite;z-index:2000;display:none}
.loading-bar.on{display:block}
@keyframes slide{0%{background-position:200% 0}100%{background-position:-200% 0}}
.dock{align-self:center;display:flex;gap:.3rem;padding:.35rem;margin:.3rem 0 max(.7rem,env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:999px;background:rgba(12,17,38,.95);transform:translateZ(0)}
.dock button{display:flex;align-items:center;gap:.5rem;padding:.7rem 1.5rem;border:0;border-radius:999px;background:transparent;color:var(--mut);font-size:1rem;font-weight:700;cursor:pointer;outline:none}
.dock button.active{background:rgba(240,189,74,.16);color:var(--gold)}
.dock button:focus{background:var(--gold);color:#14100a;box-shadow:0 0 0 3px rgba(240,189,74,.35)}
html.tv .dock button{padding:.4rem 1.2rem;font-size:.75rem}
#player{position:fixed;inset:0;z-index:100;display:none;background:#000;outline:none}
#player.open{display:block}
#player video,#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
#ytPlayer{display:none}
#hud{position:absolute;top:1rem;left:50%;max-width:60%;padding:.4rem 1.4rem;transform:translateX(-50%);border-radius:999px;background:rgba(0,0,0,.7);color:var(--gold2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;transition:opacity .3s;z-index:2}
#hud.on{opacity:1}
#closeBtn,#favBtn,.pbtn{z-index:3;padding:.55rem 1.3rem;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.65);font-size:.95rem;font-weight:700;cursor:pointer;outline:none}
#closeBtn,#favBtn{position:absolute}
#closeBtn{top:1rem;right:1rem}
#favBtn{top:1rem;left:1rem}
#favBtn.on{color:var(--gold)}
#ytBar{display:none;position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);gap:.6rem;z-index:3}
#closeBtn:focus,#favBtn:focus,.pbtn:focus{background:var(--gold);color:#14100a}
#closeBtn,#favBtn,#ytBar{transition:opacity .3s}
#player.idle{cursor:none}
#player.idle #closeBtn,#player.idle #favBtn,#player.idle #ytBar,#player.idle #hud:not(.sticky){opacity:0;pointer-events:none}
html.tv .top,html.tv .row h2{padding-right:2.6rem;padding-left:2.6rem}
html.tv .rail,html.tv .grid,html.tv .chips{padding-right:2.6rem;padding-left:2.6rem}
@media(max-width:800px){
  html{font-size:15px}
  .top{flex-direction:column;align-items:stretch;gap:.6rem;padding:max(.8rem,env(safe-area-inset-top)) 1rem .3rem}
  .brand{text-align:center}
  .search-box{width:100%}
  .row h2,.rail,.grid,.chips{padding-right:1rem;padding-left:1rem}
  .card{width:8.6rem}.card.poster{width:7.6rem}.card.ep{width:12rem}
  .grid{grid-template-columns:repeat(3,1fr);gap:1rem .6rem}
  .dock{width:calc(100% - 1.4rem);justify-content:space-around}
  .dock button{flex:1;justify-content:center;padding:.6rem .15rem;font-size:.75rem;gap:.2rem}
  #hud{max-width:40%;font-size:.8rem;top:3.6rem}
  .guide-cats{width:150px}
}
@media(max-width:400px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="splash-screen">
  <img src="63A5AFDB-C33D-4E90-8631-577AD940E645.png" alt="" class="splash-logo" onerror="this.style.display='none'">
  <div class="splash-title">👑 الزعيم IPTV 👑</div>
  <div class="splash-ver">v5</div>
</div>

<div id="loadingBar" class="loading-bar"></div>

<div id="app">
  <div class="top">
    <div class="brand">👑 الزعيم IPTV</div>
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن قناة..." readonly inputmode="search" enterkeyhint="search" autocomplete="off">
  </div>
  <div id="view"></div>
  
  <div id="tv-guide">
    <div class="guide-channels">
      <div class="guide-header">
        <span>القنوات</span>
        <span>الشعار</span>
      </div>
      <div id="guide-channels-list" style="padding-bottom: 50px;"></div>
    </div>
    <div class="guide-cats">
      <div class="guide-cat-header">
        <span>الأقسام</span>
        <span>▼</span>
      </div>
      <div id="guide-cats-list"></div>
    </div>
  </div>

  <nav class="dock" id="dock">
    <button data-v="home">🏠 الرئيسية</button>
    <button data-v="channels">📺 القنوات</button>
    <button data-v="tvguide">📋 قائمة IPTV</button>
    <button data-v="movies">🎬 أفلام</button>
    <button data-v="series">📼 مسلسلات</button>
    <button data-v="settings">⚙️ إعدادات</button>
  </nav>
</div>

<div id="player" tabindex="-1">
  <video id="videoPlayer" autoplay playsinline></video>
  <iframe id="ytPlayer" allow="autoplay; encrypted-media; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="hud"></div>
  <button id="closeBtn">✕ رجوع</button>
  <button id="favBtn">☆ مفضلة</button>
  <div id="ytBar">
    <button class="pbtn" id="ytPlay">▶ تشغيل</button>
    <button class="pbtn" id="ytOpen">↗ فتح في تطبيق يوتيوب</button>
  </div>
</div>
<script>
(function(){
  const q = new URLSearchParams(location.search).get('tv');
  const auto = /TV|Tizen|Web0S|AFT|BRAVIA|SMART|Android(?!.*Mobile)/i.test(navigator.userAgent);
  if (q === '1' || (q === null && auto)) document.documentElement.classList.add('tv');
})();

const VERSION = 'v5';
const $ = id => document.getElementById(id);
const video = $('videoPlayer'), ytPlayer = $('ytPlayer'), viewEl = $('view'), searchInput = $('searchInput'),
      dock = $('dock'), playerEl = $('player'), hud = $('hud'), favBtn = $('favBtn'),
      ytBar = $('ytBar'), ytPlay = $('ytPlay'), ytOpen = $('ytOpen'), tvGuide = $('tv-guide');

const PAGE = 60;
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="70" height="70"><rect width="70" height="70" rx="12" fill="#1a2244"/><text x="35" y="43" font-size="22" font-weight="bold" text-anchor="middle" fill="#f0bd4a" font-family="sans-serif">TV</text></svg>');

const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let allChannels = [], shown = PAGE, nextId = 0, hls = null, idx = null;
let view = 'home', cat = 'all', q = '';
let currentId = -1, curList = [], curIdx = 0, lastFocus = null, hudTimer = 0, ytTimer = 0, idleTimer = 0;
let favDirty = false, ytPlaying = false;
let favs = store.get('zaeemFav', []), recent = store.get('zaeemRecent', []);
const byUrl = new Map();
const normalizedUrls = new Set();

let CONFIG = { baseChannels: [], playlists: [], series: [] };
let baseChannels = [];
let episodes = [], episodes_baqla = [];

const categories = [
  {id:'all',name:'🏠 الرئيسية'},{id:'fav',name:'⭐ المفضلة'},{id:'سوريا',name:'🇸🇾 سوريا'},{id:'mbc',name:'MBC'},
  {id:'أخبار',name:'📰 أخبار'},{id:'رياضة',name:'⚽ رياضة'},{id:'أفلام',name:'🎬 أفلام'},{id:'مسلسلات',name:'📺 مسلسلات'},
  {id:'أطفال',name:'🧸 أطفال'},{id:'دينية',name:'🕌 دينية'},{id:'موسيقى',name:'🎵 موسيقى'},{id:'منوعة',name:'🌟 منوعة'}
];

const VOD = ['أفلام', 'مسلسلات'];
const isFav = u => favs.some(f => f.url === u);

// ============================================================
// تطبيع الروابط
// ============================================================
function normalizeUrl(u) {
  if (!u) return '';
  return u.replace(/^http:/i, 'https:').replace(/\/+$/, '').toLowerCase().trim();
}

// ============================================================
// إعادة بناء الأقسام ديناميكياً
// ============================================================
function rebuildCategories() {
  const base = [
    {id:'all', name:'🏠 الرئيسية'},
    {id:'fav', name:'⭐ المفضلة'}
  ];
  const seen = new Set(['all', 'fav']);
  const dyn = [];
  allChannels.forEach(c => {
    if (c.cat && !seen.has(c.cat)) {
      seen.add(c.cat);
      dyn.push({id: c.cat, name: c.cat});
    }
  });
  categories.length = 0;
  categories.push(...base, ...dyn);
}

const MAX_PLAYLIST_SIZE = 3 * 1024 * 1024;

// ============================================================
// إضافة القنوات (مع منع التكرار)
// ============================================================
function addChannels(list) {
  list.forEach(c => {
    const norm = normalizeUrl(c.url);
    if (!norm || normalizedUrls.has(norm)) return;
    normalizedUrls.add(norm);
    c.id = nextId++;
    byUrl.set(c.url, c);
    allChannels.push(c);
    idx = null;
  });
}

function byCat(id) {
  if (id === 'fav') return favs.map(f => byUrl.get(f.url)).filter(Boolean);
  if (!idx) { idx = {}; allChannels.forEach(c => (idx[c.cat] || (idx[c.cat] = [])).push(c)); }
  return idx[id] || [];
}

let renderTimer = 0;
function scheduleRender() {
  if (renderTimer) cancelAnimationFrame(renderTimer);
  renderTimer = requestAnimationFrame(() => {
    renderTimer = 0;
    if (!viewEl.contains(document.activeElement) && view !== 'tvguide') render();
  });
}

function showToast(msg, ms) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:5.5rem;left:50%;transform:translateX(-50%);padding:.8rem 1.6rem;border-radius:999px;background:rgba(240,189,74,.95);color:#14100a;font-weight:800;font-size:.95rem;z-index:3000;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.opacity = '0', ms || 3000);
}

window.addEventListener('load', () => {
  addChannels(favs.map(f => ({...f})));
  addChannels(recent.map(f => ({...f})));
  render();
  loadAllPlaylists();
  
  setTimeout(() => {
    const sp = $('splash-screen');
    $('app').classList.add('show');
    sp.style.opacity = '0';
    setTimeout(() => sp.remove(), 400);
    const first = viewEl.querySelector('.card') || dock.querySelector('.active');
    if (first) first.focus();
  }, 500);
});

function autoStart() {
  if (!autoOn()) return;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('zaeemLast')); } catch (e) {}
  const tryStart = () => {
    const ch = (saved && byUrl.get(saved.url)) || allChannels[0];
    if (ch) play(ch, allChannels.filter(c => c.cat === ch.cat));
  };
  if (saved) addChannels([saved]);
  if (allChannels.length) tryStart();
  else setTimeout(tryStart, 2000);
}

// ============================================================
// تحميل القوائم (النسخة المحسّنة)
// ============================================================
function loadAllPlaylists() {
  const bar = $('loadingBar');
  bar.classList.add('on');

  fetch('channels.json', {cache:'no-store'})
    .then(r => { if (!r.ok) throw new Error('channels.json'); return r.json(); })
    .then(cfg => {
      CONFIG = cfg;
      baseChannels = cfg.baseChannels || [];
      addChannels(baseChannels);
      rebuildCategories();
      scheduleRender();
      buildTVGuide();

      (cfg.series || []).forEach((s, i) => {
        const eps = s.episodes.map((yt, j) => ({
          yt,
          name: s.title.replace(/^🎬\s*/, '') + ' - الحلقة ' + (j+1),
          thumb: 'https://i.ytimg.com/vi/' + yt + '/hqdefault.jpg'
        }));
        if (i === 0) episodes = eps;
        else if (i === 1) episodes_baqla = eps;
      });
      scheduleRender();

      const lists = cfg.playlists || [];
      let done = 0, failed = 0, skipped = 0;

      if (!lists.length) {
        bar.classList.remove('on');
        rebuildCategories();
        autoStart();
        return;
      }

      lists.forEach(p => {
        fetch(p.url, {cache:'no-store'})
          .then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text().then(text => {
              if (text.length > MAX_PLAYLIST_SIZE) {
                throw new Error('FILE_TOO_BIG:' + Math.round(text.length / 1024 / 1024) + 'MB');
              }
              return text;
            });
          })
          .then(t => {
            const before = allChannels.length;
            const parsed = parseM3U(t, p.cat);
            addChannels(parsed);
            const added = allChannels.length - before;
            console.log(`✅ ${p.cat}: أُضيفت ${added} قناة (من ${parsed.length} في الملف)`);
            rebuildCategories();
            scheduleRender();
            buildTVGuide();
          })
          .catch(err => {
            if (err.message && err.message.startsWith('FILE_TOO_BIG')) {
              skipped++;
              const size = err.message.split(':')[1];
              console.warn(`⏭️ تم تجاهل ${p.url} (حجم ${size} كبير جداً)`);
              showToast(`⏭️ تجاهل قائمة كبيرة (${size}): ${p.cat}`, 4000);
            } else {
              failed++;
              console.log('❌ فشل جلب: ' + p.url, err.message);
            }
          })
          .finally(() => {
            done++;
            if (done === lists.length) {
              bar.classList.remove('on');
              rebuildCategories();
              scheduleRender();
              buildTVGuide();

              if (allChannels.length > 0) {
                setTimeout(autoStart, 300);
              }

              if (failed === lists.length) {
                showToast('⚠️ تعذّر جلب جميع القوائم، تحقق من الاتصال');
              } else if (skipped > 0) {
                showToast(`✅ تم التحميل (${skipped} قائمة كبيرة تم تجاهلها)`, 4000);
              } else {
                showToast(`✅ ${allChannels.length} قناة جاهزة`, 2500);
              }
            }
          });
      });
    })
    .catch(err => {
      bar.classList.remove('on');
      console.error('channels.json error:', err);

function buildTVGuide() {

function parseM3U(text, defaultCat) {
  const out = [];
  let name = '', logo = '', group = '';
  text.split('\n').forEach(raw => {
    const line = raw.trim();
    if (line.startsWith('#EXTINF:')) {
      const l = line.match(/tvg-logo="([^"]*)"/), g = line.match(/group-title="([^"]*)"/);
      logo = l && l[1] ? l[1] : '';
      group = g ? g[1] : '';
      const c = line.lastIndexOf(',');
      name = c !== -1 ? line.substring(c + 1).trim() : '';
    } else if (/^https?:\/\//i.test(line) && name) {
      let cat = defaultCat;
      const lg = group.toLowerCase();
      if (/mbc/i.test(name)) cat = 'mbc';
      else if (lg.includes('news') || name.includes('أخبار') || name.includes('إخبار')) cat = 'أخبار';
      else if (lg.includes('sport') || name.includes('رياض') || /bein/i.test(name)) cat = 'رياضة';
      else if (lg.includes('kid') || lg.includes('animation') || name.includes('أطفال') || name.includes('كرتون')) cat = 'أطفال';
      else if (lg.includes('relig') || name.includes('قرآن') || name.includes('إسلام')) cat = 'دينية';
      else if (lg.includes('music') || name.includes('أغاني') || name.includes('موسيقى')) cat = 'موسيقى';
      else if (/series|مسلسل|S\d{1,2}\s?E\d{1,2}/i.test(group + ' ' + name)) cat = 'مسلسلات';
      else if (lg.includes('movie') || name.includes('أفلام')) cat = 'أفلام';
      out.push({name, url: line, logo: /^https?:\/\//i.test(logo) ? logo : '', cat});
      name = ''; logo = ''; group = '';
    }
  });
  return out;
}

let playToken = 0, stepTimer = 0, onPlaying = null, onVideoError = null;
video.addEventListener('playing', () => { if (onPlaying) onPlaying(); });
video.addEventListener('error', () => { if (onVideoError) onVideoError(); });

function clearStep() { clearTimeout(stepTimer); onPlaying = null; onVideoError = null; }

function startStream(item) {
  const tok = ++playToken;
  const urls = [item.url];
  if (location.protocol === 'https:' && item.url.startsWith('http:')) urls.unshift('https:' + item.url.slice(5));
  const steps = [];
  urls.forEach(u => {
    if (window.Hls && Hls.isSupported() && /\.m3u8/i.test(u)) steps.push([u, 'hls']);
    steps.push([u, 'native']);
  });
  let i = 0, last = '';
  const next = why => {
    if (tok !== playToken) return;
    if (why) last = why;
    clearStep(); stopHls();
    if (i >= steps.length) {
      showHud('⚠️ القناة لا تعمل: ' + item.name + (last ? ' (' + last + ')' : '') + ' — اضغط ▼ للتالية', true);
      wake();
      return;
    }
    const [u, mode] = steps[i++];
    let done = false;
    const fail = w => { if (!done) { done = true; next(w); } };
    const tryPlay = () => video.play().catch(e => {
      if (e && e.name === 'NotAllowedError') { clearTimeout(stepTimer); showHud('اضغط OK للتشغيل', true); }
    });
    onPlaying = () => { if (tok === playToken) { clearTimeout(stepTimer); showHud(item.name); } };
    onVideoError = () => fail('video error');
    stepTimer = setTimeout(() => fail('timeout'), 12000);
    if (mode === 'hls') {
      const h = new Hls();
      hls = h;
      let rec = 0;
      h.loadSource(u);
      h.attachMedia(video);
      h.on(Hls.Events.MANIFEST_PARSED, tryPlay);
      h.on(Hls.Events.ERROR, (e, d) => {
        if (!d.fatal || hls !== h) return;
        if (d.type === Hls.ErrorTypes.MEDIA_ERROR && rec++ < 2) h.recoverMediaError();
        else fail(d.details || 'hls');
      });
    } else {
      video.src = u;
      video.load();
      tryPlay();
    }
  };
  next();
}

function play(item, list) {
  if (!playerEl.classList.contains('open')) lastFocus = document.activeElement;
  playerEl.classList.add('open');
  playerEl.focus();
  curList = list;
  curIdx = Math.max(0, list.indexOf(item));
  stopHls();
  clearTimeout(ytTimer);
  ytPlaying = false;
  updateFav(item);
  wake();

  if (item.yt) {
    playToken++; clearStep();
    video.pause();
    video.style.display = 'none';
    ytPlayer.style.display = 'block';
    ytBar.style.display = 'flex';
    ytPlay.focus();

    let playlist = curList.map(e => e.yt).join(',');
    let currentIndex = curIdx;
    const org = /^https?:/.test(location.origin) ? '&origin=' + encodeURIComponent(location.origin) : '';
    ytPlayer.src = `https://www.youtube.com/embed/${item.yt}?autoplay=1&rel=0&playlist=${playlist}&index=${currentIndex}&enablejsapi=1&playsinline=1&controls=0&modestbranding=1&iv_load_policy=3&fs=0${org}`;

    showHud(item.name);
    ytTimer = setTimeout(() => {
      showHud('اضغط OK على «تشغيل» أو افتحه في تطبيق يوتيوب', true);
    }, 9000);
    return;
  }

  currentId = item.id;
  try { localStorage.setItem('zaeemLast', JSON.stringify({name:item.name,url:item.url,logo:item.logo,cat:item.cat})); } catch (e) {}
  pushRecent(item);
  stopYouTube();
  video.style.display = 'block';
  video.pause();
  showHud('جاري التحميل... ' + item.name, true);
  startStream(item);
}

function zap(dir) {
  if (curList.length < 2) return;
  curIdx = (curIdx + dir + curList.length) % curList.length;
  play(curList[curIdx], curList);
}

function closePlayer() {
  stopHls(); stopYouTube(); playToken++; clearStep();
  clearTimeout(idleTimer);
  video.pause();
  video.removeAttribute('src');
  video.load();
  hud.classList.remove('on', 'sticky');
  playerEl.classList.remove('open', 'idle');
  currentId = -1;
  let target = lastFocus && lastFocus.isConnected ? lastFocus : null;
  if (favDirty) { favDirty = false; target = null; render(); }
  else if (view === 'home' || view === 'channels') {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('live'));
    if (!target) render();
  }
  target = target || viewEl.querySelector('.card') || dock.querySelector('.active');
  if (target) target.focus();
}
$('closeBtn').onclick = closePlayer;

function focusables() {
  return Array.from(document.querySelectorAll('.card,.chip,.dock button,.search-box,.more-btn,.guide-item,.guide-cat'))
    .filter(el => el.offsetParent !== null);
}

function spatialMove(dir) {
  const cur = document.activeElement;
  const list = focusables();
  if (!list.includes(cur)) { if (list[0]) list[0].focus(); return; }
  const r = cur.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bestScore = Infinity;
  list.forEach(el => {
    if (el === cur) return;
    const b = el.getBoundingClientRect();
    const dx = b.left + b.width / 2 - cx, dy = b.top + b.height / 2 - cy;
    let main, cross;
    if (dir === 'ArrowUp')    { if (dy >= -5) return; main = -dy; cross = Math.abs(dx); }
    if (dir === 'ArrowDown')  { if (dy <= 5)  return; main = dy;  cross = Math.abs(dx); }
    if (dir === 'ArrowLeft')  { if (dx >= -5) return; main = -dx; cross = Math.abs(dy); }
    if (dir === 'ArrowRight') { if (dx <= 5)  return; main = dx;  cross = Math.abs(dy); }
    const score = main + cross * 2.5;
    if (score < bestScore) { bestScore = score; best = el; }
  });
  if (best) { best.focus(); best.scrollIntoView({block: 'nearest', inline: 'center'}); }
}

const isBack = e => e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack' || e.keyCode === 4 || e.keyCode === 10009 || e.keyCode === 461;

document.addEventListener('keydown', e => {
  const t = document.activeElement;
  
  if (playerEl.classList.contains('open')) {
    wake();
    if (e.key === 'ArrowDown' || e.key === 'ChannelDown' || e.key === 'PageDown') { e.preventDefault(); zap(1); }
    else if (e.key === 'ArrowUp' || e.key === 'ChannelUp' || e.key === 'PageUp') { e.preventDefault(); zap(-1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const bs = [$('closeBtn'), favBtn, ytPlay, ytOpen].filter(b => b.offsetParent !== null);
      if (bs.length) {
        e.preventDefault();
        const fwd = e.key === 'ArrowRight', i = bs.indexOf(t);
        bs[i < 0 ? (fwd ? 0 : bs.length - 1) : (i + (fwd ? 1 : -1) + bs.length) % bs.length].focus();
      }
    }
    else if (e.key === 'Enter' && (t === playerEl || t === video) && video.style.display !== 'none') {
      e.preventDefault();
      if (video.paused) video.play().catch(() => {}); else video.pause();
      showHud(video.paused ? '⏸' : '▶');
    }
    else if (isBack(e)) { e.preventDefault(); closePlayer(); }
    return;
  }

  if (view === 'tvguide') {
    if (e.key === 'ArrowLeft' && t.classList.contains('guide-item')) {
      e.preventDefault();
      document.querySelector('.guide-cat.active')?.focus();
    } else if (e.key === 'ArrowRight' && t.classList.contains('guide-cat')) {
      e.preventDefault();
      document.querySelector('.guide-item')?.focus();
    } else if (e.key === 'Enter' && (t.classList.contains('guide-item') || t.classList.contains('guide-cat'))) {
      e.preventDefault();
      t.click();
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (e.key === 'ArrowDown' && t.tagName === 'BUTTON') e.preventDefault();
      setTimeout(() => { if(document.activeElement) document.activeElement.scrollIntoView({block: 'nearest'}); }, 50);
    } else if (isBack(e)) {
      e.preventDefault();
      const a = dock.querySelector('.active'); if (a) a.focus();
    }
    return;
  }

  const typing = t && t.tagName === 'INPUT' && !t.readOnly;
  if (typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
  if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    spatialMove(e.key);
  } else if (e.key === 'Enter' && t && (t.classList.contains('card') || t.classList.contains('chip') || t.classList.contains('more-btn') || t.tagName === 'BUTTON')) {
    t.click();
  } else if (isBack(e)) {
    if (typing) return;
    e.preventDefault();
    const a = dock.querySelector('.active'); if (a) a.focus();
  }
});
</script>
</body>
</html>
