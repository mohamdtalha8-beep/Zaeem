<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزعيم - IPTV</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('IMG_6458.jpeg'); 
            background-color: #1a1a1a; 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px 10px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); 
            z-index: -1;
        }

        h1 { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); font-size: 28px; margin-bottom: 5px; }
        p.subtitle { color: #aaa; margin-top: 0; margin-bottom: 20px; }
        
        .player-container {
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            border: 2px solid #333;
            position: relative;
            padding-top: 56.25%;
        }

        video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
        }

        .channel-btn {
            background-color: rgba(30, 30, 30, 0.9);
            color: white;
            border: 1px solid #444;
            padding: 15px 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .channel-btn:hover, .channel-btn.active {
            background-color: #FFD700;
            color: #000;
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
        }

        /* تصميم أزرار يوتيوب */
        .yt-btn {
            background-color: rgba(200, 0, 0, 0.8);
            border-color: #f00;
        }
        .yt-btn:hover {
            background-color: #f00;
            color: white;
        }
    </style>
</head>
<body>

    <h1>👑 الزعيم IPTV 👑</h1>
    
    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <!-- قسم القنوات المباشرة -->
    <h2 style="color: #FFD700; margin-top: 20px;">📺 القنوات المباشرة</h2>
    <div class="channels-grid">
        <button class="channel-btn" onclick="playChannel('https://svs.itworkscdn.net/syriatvlive/syriatv.smil/playlist_dvr.m3u8', this)">التلفزيون السوري</button>
        <button class="channel-btn" onclick="playChannel('https://svs.itworkscdn.net/syriadramalive/syriadrama.smil/playlist_dvr.m3u8', this)">سوريا دراما</button>
        <button class="channel-btn" onclick="playChannel('https://live-hls-web-aja.getaj.net/AJA/01.m3u8', this)">الجزيرة</button>
    </div>

    <!-- قسم المسلسل -->
    <h2 style="color: #FFD700; margin-top: 30px;">🎬 مسلسل الإمام أحمد بن حنبل</h2>
    <p style="color: #aaa; font-size: 14px;">اضغط على الحلقة لتفتح في تطبيق يوتيوب</p>
    
    <div class="channels-grid">
        <!-- الأزرار جاهزة، كل ما عليك فعله هو وضع الرابط الحقيقي مكان علامة # -->
        <a href="#" target="_blank" class="channel-btn yt-btn">الحلقة 1</a>
        <a href="#" target="_blank" class="channel-btn yt-btn">الحلقة 2</a>
        <a href="#" target="_blank" class="channel-btn yt-btn">الحلقة 3</a>
        <a href="#" target="_blank" class="channel-btn yt-btn">الحلقة 4</a>
        <a href="#" target="_blank" class="channel-btn yt-btn">الحلقة 5</a>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        
        function playChannel(url, btnElement) {
            video.src = url;
            video.play();
            const buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
        }
    </script>
</body>
</html>
