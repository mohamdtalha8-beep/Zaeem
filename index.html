<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 الزعيم IPTV 👑</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; overflow-x: hidden; }
        
        .search-container { position: sticky; top: 0; background-color: #1f1f1f; padding: 15px 20px; display: flex; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 1000; }
        .search-box { width: 100%; max-width: 800px; }
        .search-box input { width: 100%; padding: 12px 20px; font-size: 18px; border: 2px solid #333; border-radius: 30px; background-color: #2b2b2b; color: white; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: #00a8ff; background-color: #333; transform: scale(1.02); }

        .main-container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        h2 { margin-bottom: 15px; color: #00a8ff; border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 15px; }

        /* تصميم الأزرار */
        .btn {
            background-color: #2b2b2b; color: white; border: 2px solid #444; padding: 15px; border-radius: 10px;
            text-decoration: none; text-align: center; font-size: 18px; font-weight: bold; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .btn:hover, .btn:focus { background-color: #00a8ff; color: #121212; border-color: #00a8ff; transform: scale(1.05); outline: none; }

        /* شاشة المشاهدة المنبثقة (Modal) */
        .video-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9); z-index: 2000; justify-content: center; align-items: center; flex-direction: column;
        }
        .video-modal iframe {
            width: 90%; height: 80%; border: none; border-radius: 10px; background: #000;
        }
        .close-btn {
            margin-top: 15px; padding: 10px 30px; background-color: #ff4757; color: white; border: none;
            border-radius: 5px; font-size: 20px; cursor: pointer; font-weight: bold;
        }
        .close-btn:hover { background-color: #ff6b81; }
    </style>
</head>
<body>

    <!-- شريط البحث -->
    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن قناة أو مسلسل..." onkeyup="filterContent()">
        </div>
    </div>

    <!-- المحتوى -->
    <div class="main-container">
        <h2>📺 القنوات المباشرة</h2>
        <div class="grid-container" id="channelsList">
            <!-- ضع رابط البث الحقيقي في دالة playVideo -->
            <div class="btn" onclick="playVideo('ضع_رابط_القناة_هنا.m3u8')">التلفزيون السوري</div>
            <div class="btn" onclick="playVideo('ضع_رابط_القناة_هنا.m3u8')">سوريا دراما</div>
            <div class="btn" onclick="playVideo('ضع_رابط_القناة_هنا.m3u8')">الجزيرة</div>
        </div>

        <h2>🎬 مسلسل الإمام أحمد بن حنبل</h2>
        <p style="margin-bottom: 10px; color: #aaa;">اختر الحلقة التي تريد مشاهدتها:</p>
        <div class="episodes-grid" id="episodesList">
            <!-- ضع رابط الفيديو الخاص بكل حلقة هنا -->
            <div class="btn" onclick="playVideo('رابط_الحلقة_1')">الحلقة 1</div>
            <div class="btn" onclick="playVideo('رابط_الحلقة_2')">الحلقة 2</div>
            <div class="btn" onclick="playVideo('رابط_الحلقة_3')">الحلقة 3</div>
            <div class="btn" onclick="playVideo('رابط_الحلقة_4')">الحلقة 4</div>
            <div class="btn" onclick="playVideo('رابط_الحلقة_5')">الحلقة 5</div>
            <!-- أكمل باقي الحلقات بنفس الطريقة -->
        </div>
    </div>

    <!-- نافذة المشاهدة -->
    <div id="videoModal" class="video-modal">
        <iframe id="videoPlayer" allowfullscreen></iframe>
        <button class="close-btn" onclick="closeVideo()">إغلاق (رجوع)</button>
    </div>

    <script>
        // دالة تشغيل الفيديو
        function playVideo(url) {
            if (url.includes('ضع_رابط')) {
                alert('الرجاء وضع رابط الفيديو الحقيقي في الكود أولاً!');
                return;
            }
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('videoPlayer');
            player.src = url; // وضع الرابط في المشغل
            modal.style.display = 'flex'; // إظهار الشاشة
        }

        // دالة إغلاق الفيديو
        function closeVideo() {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('videoPlayer');
            player.src = ''; // إيقاف الفيديو
            modal.style.display = 'none'; // إخفاء الشاشة
        }

        // دالة البحث (بقيت كما هي)
        function filterContent() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let items = document.querySelectorAll('.btn');
            items.forEach(item => {
                let txt = item.textContent || item.innerText;
                if (txt.toLowerCase().indexOf(input) > -1) {
                    item.style.display = "flex";
                } else {
                    item.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
