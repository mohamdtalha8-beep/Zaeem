<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الزعيم IPTV</title>

<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<style>
#splash-screen{position:fixed;inset:0;background:#050505;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity 1s ease-in-out}
.splash-image{width:70%;max-width:300px;border-radius:20px;box-shadow:0 0 30px rgba(255,215,0,.4);animation:zoomIn 2s ease-in-out infinite alternate;margin-bottom:20px}
.splash-title{color:#FFD700;font-size:36px;font-weight:bold;text-shadow:0 0 20px rgba(255,215,0,.8);text-align:center}
@keyframes zoomIn{from{transform:scale(1)}to{transform:scale(1.05)}}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-image:url('IMG_6458.jpeg');background-color:#0f0f0f;background-size:cover;background-position:center;background-attachment:fixed;color:#fff;text-align:center;margin:0;padding:20px 10px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:-1}
h1{color:#FFD700;font-size:28px;margin-bottom:20px}
.ver{color:#888;font-size:12px;margin:-12px 0 12px}
h2{color:#FFD700;text-align:right;font-size:20px;margin-top:30px;border-right:4px solid #FFD700;padding-right:15px}
.player-wrapper{max-width:500px;margin:0 auto 20px;position:relative}
.video-js{width:100%!important;height:auto!important;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:2px solid #333;background:#000}
#ytPlayer{position:absolute;inset:0;width:100%;height:100%;border:none;display:none}
#status{position:absolute;inset:auto 0 8px 0;color:#FFD700;font-size:14px;pointer-events:none;text-shadow:0 0 6px #000;z-index:10}
.player-container:fullscreen{padding-top:0;width:100%;height:100%;border:none}
.player-container:fullscreen #status{top:24px;bottom:auto;font-size:28px;z-index:5}
.player-controls{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px;background:rgba(30,30,30,.9);border-radius:8px;border:1px solid #444}
.ctrl-btn{background:#FFD700;color:#000;border:none;padding:10px 15px;border-radius:5px;font-weight:bold;cursor:pointer}
.ctrl-btn:focus{outline:3px solid #fff}
.sleep-timer-select{background:#222;color:#FFD700;border:1px solid #FFD700;padding:10px;border-radius:5px;font-weight:bold}
.selector-container{background:rgba(30,30,30,.95);padding:20px;border-radius:12px;max-width:800px;margin:20px auto;border:1px solid #444}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:8px}
.tab{flex:0 0 auto;background:#111;color:#FFD700;border:1px solid #FFD700;padding:9px 16px;border-radius:20px;font-size:15px;font-weight:bold;cursor:pointer;outline:none}
.tab:focus,.tab.active{background:#FFD700;color:#000}
.tab:focus{box-shadow:0 0 0 3px #fff}
.fake-search-btn{width:95%;padding:15px;font-size:16px;border-radius:8px;border:2px solid #FFD700;background:#111;color:#FFD700;margin:0 auto 15px;cursor:pointer;display:block;font-weight:bold}
.fake-search-btn:focus,.fake-search-btn:hover{background:#FFD700;color:#000;outline:none}
.search-box{width:95%;padding:15px;font-size:16px;border-radius:8px;border:2px solid #FFD700;background:#222;color:#fff;margin-bottom:15px;display:none;text-align:center;outline:none}
.channel-list-container{max-height:500px;overflow-y:auto;background:#111;border:1px solid #333;border-radius:8px;scroll-behavior:smooth}
.channel-item{display:flex;align-items:center;padding:12px 15px;border-bottom:1px solid #222;cursor:pointer;outline:none;transition:.2s}
.channel-item:hover,.channel-item:focus,.channel-item.selected{background:#FFD700}
.channel-item:hover .channel-name,.channel-item:focus .channel-name,.channel-item.selected .channel-name{color:#000}
.channel-logo{width:50px;height:50px;object-fit:contain;margin-left:15px;background:#fff;border-radius:8px;padding:3px}
.channel-name{font-size:18px;font-weight:bold;color:#ddd;text-align:right}
.count{color:#aaa;font-size:14px;margin:0 0 8px;text-align:right}
.series-select{width:100%;padding:15px;font-size:18px;font-weight:bold;color:#FFD700;background:#111;border:2px solid #FFD700;border-radius:8px;cursor:pointer;text-align:center;outline:none}
.loading-text,.empty{color:#FFD700;font-size:18px;padding:20px;text-align:center}
</style>
</head>
<body>

<div id="splash-screen">
  <img src="63A5AFDB-C33D-4E90-8631-577AD940E645.png" alt="شعار الزعيم" class="splash-image">
  <div class="splash-title">👑 الزعيم IPTV 👑</div>

<div id="app-content" style="display:none">
  <h1>👑 الزعيم IPTV 👑</h1>
  <div class="ver">الإصدار 9.2 (يفتح على الأخبارية السورية)</div>

  <div class="player-wrapper">
    <div class="player-container" id="playerBox">
      <video id="videoPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay playsinline></video>

      <div id="status"></div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" onclick="zap(-1)">⏮ السابقة</button>

<script>
const player = videojs('videoPlayer', { fluid: true, html5: { nativeTextTracks: false } });
const ytPlayer = document.getElementById('ytPlayer');
const episodeSelect = document.getElementById('episodeSelect');
const searchInput = document.getElementById('searchInput');
const fakeSearchBtn = document.getElementById('fakeSearchBtn');
const listBox = document.getElementById('channelListContainer');
const playerBox = document.getElementById('playerBox');
const statusEl = document.getElementById('status');
const tabsEl = document.getElementById('tabs');
const countEl = document.getElementById('count');

let allChannels = [], sleepTimeout, currentCat = 'all';
let shownList = [], nowPlaying = null, nameLabel = '', nameTimer, zapTimer;
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"><rect width="50" height="50" fill="#333"/><text x="25" y="32" font-size="18" fill="#FFD700" text-anchor="middle">TV</text></svg>');

const CATEGORIES = [
  { id: 'all',   label: 'الكل' },
  { id: 'syria', label: '🇸🇾 سوريا' },
  { id: 'mbc',   label: 'MBC' },
  { id: 'news',  label: 'أخبار' },
  { id: 'sports',label: 'رياضة' },
  { id: 'movies',label: 'أفلام ومسلسلات' },
  { id: 'kids',  label: 'أطفال' },
  { id: 'religious', label: 'دينية' },
  { id: 'music', label: 'موسيقى' },
  { id: 'other', label: 'منوعة' }
];

function categorize(group, name) {
  const g = (group || '').toLowerCase();
  if (/mbc|إم بي سي|ام بي سي/i.test(name)) return 'mbc';
  if (/syria|سوري|orient|أورينت|اورينت|addounia|الدنيا/i.test(name)) return 'syria';
  if (g.includes('news') || name.includes('أخبار') || name.includes('إخبار')) return 'news';
  if (g.includes('sport') || name.includes('رياض')) return 'sports';
  if (g.includes('movie') || g.includes('series') || g.includes('entertainment') || g.includes('comedy') || name.includes('دراما') || name.includes('أفلام') || name.includes('سينما')) return 'movies';
  if (g.includes('kid') || g.includes('animation') || name.includes('أطفال') || name.includes('كرتون')) return 'kids';
  if (g.includes('relig') || name.includes('قرآن') || name.includes('إسلام') || name.includes('quran')) return 'religious';
  if (g.includes('music') || name.includes('أغاني') || name.includes('موسيقى')) return 'music';
  return 'other';
}

const customChannelsList = `#EXTM3U
#EXTINF:-1,AR: MBC 1
https://shls-mbc1-prod-dub.shahid.net/out/v1/2f9b8d0a5b6c4e3f8d7c6b5a4e3f2d1c/index.m3u8
#EXTINF:-1,AR: MBC 2
https://shls-mbc2-prod-dub.shahid.net/out/v1/1f9b8d0a5b6c4e3f8d7c6b5a4e3f2d1c/index.m3u8
#EXTINF:-1,AR: MBC 3
https://shls-mbc3-eur-prod-dub.shahid.net/out/v1/fce09dd6a967431a871efb3b8dec9f82/index.m3u8
#EXTINF:-1,AR: MBC 4
https://mbc4-prod-dub-ak.akamaized.net/out/v1/c08681f81775496ab4afa2bac7ae7638/index.m3u8
#EXTINF:-1,AR: MBC Action
https://shls-mbcaction-prod.shahid.net/mbcaction-prod_1.m3u8
#EXTINF:-1,AR: MBC Drama
https://mbc1-enc.edgenextcdn.net/out/v1/b0b3a0e6750d4408bb86d703d5feffd1/index.m3u8
#EXTINF:-1,AR: Al Jazeera
https://live-hls-web-aje.getaj.net/AJE/01.m3u8
#EXTINF:-1,AR: Al Arabiya
https://live.alarabiya.net/alarabiapublish/alarabiya.smil/playlist.m3u8
#EXTINF:-1,SY: Syria TV
https://svs.itworkscdn.net/syriatvlive/syriatv.smil/playlist_dvr.m3u8
#EXTINF:-1,SY: Syria Drama
https://svs.itworkscdn.net/syriadramalive/syriadrama.smil/playlist_dvr.m3u8
#EXTINF:-1,SY: Syria News
https://svs.itworkscdn.net/syrianews/syrianews.smil/playlist_dvr.m3u8`;

const PLAYLISTS = [
  { url: "https://iptv-org.github.io/iptv/countries/sy.m3u", forceCat: 'syria' },
  { url: "https://iptv-org.github.io/iptv/regions/arab.m3u" }
];
const MOVIES_URL = "https://www.free-codecs.com/app/iptv-finder/data/ready/movies.m3u";

function parseM3U(text, forceCat) {
  const out = [];
  let name = '', logo = '', group = '';
  text.split('\n').forEach(raw => {
    const line = raw.trim();
    if (line.startsWith('#EXTINF:')) {
      const l = line.match(/tvg-logo="([^"]*)"/);
      const g = line.match(/group-title="([^"]*)"/);
      logo = l && l[1] ? l[1] : '';
      group = g ? g[1] : '';
      const c = line.lastIndexOf(',');
      name = c !== -1 ? line.substring(c + 1).trim() : '';
    } else if (line.startsWith('http') && name) {
      out.push({ name, url: line, logo, cat: forceCat || categorize(group, name) });
      name = ''; logo = ''; group = '';
    }
  });
  return out;
}

window.addEventListener('load', () => {
  setTimeout(() => {
    const splash = document.getElementById('splash-screen');
    splash.style.opacity = '0';
    setTimeout(() => {
      splash.style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
      buildTabs();
      
      allChannels = parseM3U(customChannelsList);
      applyFilters();

      // 🚨 التعديل هنا: فتح قناة "الأخبارية السورية" دائماً عند الدخول
      let defaultChannel = allChannels.find(c => c.name.includes('Syria News') || c.name.includes('الأخبارية السورية'));
      if(defaultChannel) {
          playChannel(defaultChannel, false);
      } else if(allChannels.length > 0) {
          playChannel(allChannels[0], false);
      }

      Promise.all(PLAYLISTS.map(p =>
        fetch(p.url, { cache: 'no-store' }).then(r => r.text()).then(t => parseM3U(t, p.forceCat)).catch(() => [])
      )).then(results => {
        const seen = new Set(allChannels.map(c => c.url));
        results.flat().forEach(c => {
          if (!seen.has(c.url)) { seen.add(c.url); allChannels.push(c); }
        });
        applyFilters();
      });

      fetch(MOVIES_URL, { cache: 'no-store' })
        .then(r => r.text())
        .then(t => {
          const movies = parseM3U(t, 'movies');
          const seen = new Set(allChannels.map(c => c.url));
          movies.forEach(m => {
            if (!seen.has(m.url)) { seen.add(m.url); allChannels.push(m); }
          });
          applyFilters();
        }).catch(() => console.log("فشل جلب الأفلام."));

    }, 1000);
  }, 2500);
});

function buildTabs() {
  tabsEl.textContent = '';
  CATEGORIES.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'tab' + (cat.id === currentCat ? ' active' : '');
    b.textContent = cat.label;
    b.onclick = () => {
      currentCat = cat.id;
      tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      b.classList.add('active');
      applyFilters();
    };
    tabsEl.appendChild(b);
  });
}

function applyFilters() {
  const q = searchInput.value.toLowerCase();
  const list = allChannels.filter(c =>
    (currentCat === 'all' || c.cat === currentCat) && c.name.toLowerCase().includes(q));
  renderChannels(list);
}

function renderChannels(list) {
  listBox.textContent = '';
  shownList = list;
  countEl.textContent = 'العدد: ' + list.length;
  if (!list.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'لا توجد قنوات مطابقة.';
    listBox.appendChild(p);
    return;
  }
  const frag = document.createDocumentFragment();
  list.forEach((ch, idx) => {
    const item = document.createElement('div');
    item.className = 'channel-item';
    item.tabIndex = 0;
    item.dataset.i = idx;
    if (ch === nowPlaying) item.classList.add('selected');
    item.onclick = () => playChannel(ch, true);
    const img = document.createElement('img');
    img.className = 'channel-logo';
    img.src = /^https?:\/\//.test(ch.logo) ? ch.logo : PLACEHOLDER;
    img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER; };
    const span = document.createElement('span');
    span.className = 'channel-name';
    span.textContent = ch.name;
    item.append(img, span);
    frag.appendChild(item);
  });
  listBox.appendChild(frag);
}

function setStatus(msg) { statusEl.textContent = msg || ''; }

function playM3UChannel(url, scroll) {
  if (!url) return;
  ytPlayer.src = '';
  ytPlayer.style.display = 'none';
  document.getElementById('videoPlayer').style.display = 'block';
  
  player.src({ src: url, type: 'application/x-mpegURL' });
  player.play().catch(e => console.log("خطأ:", e));
  
  setStatus('⏳ ' + nameLabel);
  const done = () => { setStatus(nameLabel); clearTimeout(nameTimer); nameTimer = setTimeout(() => setStatus(''), 4000); };
  player.one('playing', done);
  
  if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function playYouTube(id) {
  if (!id) return;
  player.pause();
  document.getElementById('videoPlayer').style.display = 'none';
  setStatus('');
  ytPlayer.style.display = 'block';
  ytPlayer.src = 'https://www.youtube.com/embed/' + encodeURIComponent(id) + '?autoplay=1&rel=0&mute=1';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleFullScreen() {
  if (player.isFullscreen()) player.exitFullscreen();
  else player.requestFullscreen();
}

function setSleepTimer(minutes) {
  clearTimeout(sleepTimeout);
  if (minutes > 0) {
    sleepTimeout = setTimeout(() => {
      player.pause();
      ytPlayer.src = '';
      alert('تم إيقاف التشغيل بواسطة مؤقت النوم.');
      document.getElementById('sleepTimer').value = '0';
    }, minutes * 60 * 1000);
  }
}

function playChannel(ch, scroll) {
  clearTimeout(zapTimer);
  nowPlaying = ch;
  nameLabel = '📺 ' + ch.name;
  playM3UChannel(ch.url, scroll);
  markSelected();
}

function markSelected() {
  listBox.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
  const idx = shownList.indexOf(nowPlaying);
  const el = idx > -1 ? listBox.querySelector('[data-i="' + idx + '"]') : null;
  if (el) {
    el.classList.add('selected');
    listBox.scrollTop += el.getBoundingClientRect().top - listBox.getBoundingClientRect().top - listBox.clientHeight / 2;
  }
}

function zap(dir) {
  const list = shownList.length ? shownList : allChannels;
  if (!list.length) return;
  let i = list.indexOf(nowPlaying);
  i = i === -1 ? (dir > 0 ? 0 : list.length - 1) : (i + dir + list.length) % list.length;
  playChannel(list[i], false);
}

function activateSearch() {
  fakeSearchBtn.style.display = 'none';
  searchInput.style.display = 'block';
  searchInput.focus();
}
function hideSearch() {
  searchInput.style.display = 'none';
  fakeSearchBtn.style.display = 'block';
  fakeSearchBtn.focus();
}

function keyName(e) {
  const k = e.key, c = e.keyCode;
  if (k === 'ChannelUp' || c === 166 || c === 427 || c === 33) return 'chup';
  if (k === 'ChannelDown' || c === 167 || c === 428 || c === 34) return 'chdown';
  if (k === 'ArrowDown' || k === 'Down' || c === 40) return 'down';
  if (k === 'ArrowUp' || k === 'Up' || c === 38) return 'up';
  if (k === 'ArrowLeft' || k === 'Left' || c === 37) return 'left';
  if (k === 'ArrowRight' || k === 'Right' || c === 39) return 'right';
  if (k === 'Enter' || c === 13 || c === 23) return 'enter';
  if (k === 'Escape' || k === 'GoBack' || c === 27 || c === 4 || c === 10009) return 'back';
  if (k === 'Backspace' || c === 8) return 'backspace';
  return '';
}

function focusFirstChannel() {
  const first = listBox.querySelector('.channel-item');
  if (first) { searchInput.blur(); first.focus(); return true; }
  return false;
}

document.addEventListener('keydown', e => {
  const key = keyName(e);
  if (!key) return;
  if (key === 'chup' || key === 'chdown') { e.preventDefault(); zap(key === 'chup' ? 1 : -1); return; }
  const a = document.activeElement;
  const tabs = Array.from(tabsEl.querySelectorAll('.tab'));

  if (searchInput.style.display === 'block') {
    if (key === 'down') { e.preventDefault(); if (!focusFirstChannel()) hideSearch(); return; }
    if (key === 'back' || (key === 'backspace' && searchInput.value === '')) {
      e.preventDefault(); hideSearch(); searchInput.value = ''; applyFilters();
    }
    return;
  }

  const ctrls = Array.from(document.querySelectorAll('.player-controls button, .player-controls select'));
  let handled = true;
  if (a && ctrls.includes(a)) {
    const ci = ctrls.indexOf(a);
    if (key === 'right' && ci > 0) ctrls[ci - 1].focus();
    else if (key === 'left' && ci < ctrls.length - 1) ctrls[ci + 1].focus();
    else if (key === 'down') (tabs.find(t => t.classList.contains('active')) || tabs[0]).focus();
    else if (key === 'up') window.scrollTo({ top: 0, behavior: 'smooth' });
    else if (key === 'enter' && a.tagName === 'BUTTON') a.click();
    else handled = false;
  } else if (a && a.classList.contains('tab')) {
    const idx = tabs.indexOf(a);
    if (key === 'right' && idx > 0) tabs[idx - 1].focus();
    else if (key === 'left' && idx < tabs.length - 1) tabs[idx + 1].focus();
    else if (key === 'down') fakeSearchBtn.focus();
    else if (key === 'up') ctrls[0].focus();
    else if (key === 'enter') a.click();
    else handled = false;
  } else if (a === fakeSearchBtn) {
    if (key === 'up') (tabs.find(t => t.classList.contains('active')) || tabs[0]).focus();
    else if (key === 'down') focusFirstChannel();
    else if (key === 'enter') activateSearch();
    else handled = false;
  } else if (a && a.classList.contains('channel-item')) {
    if (key === 'down') { if (a.nextElementSibling) a.nextElementSibling.focus(); }
    else if (key === 'up') { if (a.previousElementSibling) a.previousElementSibling.focus(); else fakeSearchBtn.focus(); }
    else if (key === 'enter') a.click();
    else handled = false;
  } else if ((key === 'left' || key === 'right') && (!a || a === document.body)) {
    zap(key === 'left' ? 1 : -1);
  } else if (key === 'down' || key === 'up') {
    fakeSearchBtn.focus();
  } else handled = false;

  if (handled) e.preventDefault();
});

function isFull() { return document.fullscreenElement || document.webkitFullscreenElement; }

document.addEventListener('keydown', e => {
  if (!isFull()) return;
  const key = keyName(e);
  if (key === 'chup' || key === 'up' || key === 'left') {
    e.preventDefault(); e.stopPropagation(); zap(1);
  } else if (key === 'chdown' || key === 'down' || key === 'right') {
    e.preventDefault(); e.stopPropagation(); zap(-1);
  }
}, true);

function onFullChange() {
  if (isFull()) {
    setStatus('▲ ▼ لتقليب القنوات');
    clearTimeout(nameTimer);
    nameTimer = setTimeout(() => setStatus(''), 4000);
  }
}
document.addEventListener('fullscreenchange', onFullChange);
document.addEventListener('webkitfullscreenchange', onFullChange);

document.addEventListener('focusin', e => {
  if (e.target.closest && e.target.closest('.player-controls')) window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
