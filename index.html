<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزعيم - IPTV</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f; /* لون خلفية داكن يشبه الصورة */
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px 10px;
        }

        h1 { color: #FFD700; font-size: 28px; margin-bottom: 20px; }
        h2 { color: #FFD700; text-align: right; padding-right: 20px; font-size: 20px; margin-top: 30px; }

        .player-container {
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            position: relative;
            padding-top: 56.25%;
            border: 2px solid #333;
        }

        video, iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        #ytPlayer { display: none; }

        /* تصميم شبكة البوسترات (مثل الصورة) */
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
            padding: 10px;
        }

        /* تصميم البوستر */
        .poster-item {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background-color: #222;
        }

        .poster-item img {
            width: 100%;
            height: 180px; /* ارتفاع ثابت للصور */
            object-fit: cover; /* لضمان عدم تشوه الصورة */
            display: block;
        }

        .poster-item:hover {
            transform: scale(1.05); /* تكبير الصورة قليلاً عند التمرير */
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        /* اسم الفيلم أسفل الصورة */
        .poster-title {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px;
            font-size: 12px;
            text-align: center;
            position: absolute;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .channel-btn {
            background-color: #222;
            color: white;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>👑 الزعيم IPTV 👑</h1>
    
    <!-- المشغل -->
    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
        <iframe id="ytPlayer" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>

    <!-- قسم القنوات المباشرة -->
    <h2>📺 القنوات المباشرة</h2>
    <div style="display: flex; justify-content: center; flex-wrap: wrap;">
        <button class="channel-btn" onclick="playChannel('https://svs.itworkscdn.net/syriatvlive/syriatv.smil/playlist_dvr.m3u8', this)">التلفزيون السوري</button>
        <button class="channel-btn" onclick="playChannel('https://svs.itworkscdn.net/syriadramalive/syriadrama.smil/playlist_dvr.m3u8', this)">سوريا دراما</button>
        <button class="channel-btn" onclick="playChannel('https://live-hls-web-aja.getaj.net/AJA/01.m3u8', this)">الجزيرة</button>
    </div>

    <!-- قسم المسلسلات (شبكة البوسترات) -->
    <h2>🎬 مسلسلات وأفلام</h2>
    <div class="poster-grid">
        
        <!-- البوستر الأول (الحلقة 1) -->
        <div class="poster-item" onclick="playYouTube('rAOJZMPjxLc', this)">
            <!-- هنا رابط الصورة (يمكنك تغييره لاحقاً) -->
            <img src="https://i.ytimg.com/vi/rAOJZMPjxLc/maxresdefault.jpg" alt="الحلقة 1">
            <div class="poster-title">الإمام أحمد بن حنبل - ح1</div>
        </div>

        <!-- البوستر الثاني (الحلقة 2) -->
        <div class="poster-item" onclick="playYouTube('e8jh0NfoUxQ', this)">
            <img src="https://i.ytimg.com/vi/e8jh0NfoUxQ/maxresdefault.jpg" alt="الحلقة 2">
            <div class="poster-title">الإمام أحمد بن حنبل - ح2</div>
        </div>

        <!-- البوستر الثالث (الحلقة 3) -->
        <div class="poster-item" onclick="playYouTube('nN5A1RGBF3c', this)">
            <img src="https://i.ytimg.com/vi/nN5A1RGBF3c/maxresdefault.jpg" alt="الحلقة 3">
            <div class="poster-title">الإمام أحمد بن حنبل - ح3</div>
        </div>

        <!-- يمكنك نسخ هذا القسم وإضافة المزيد -->
        <div class="poster-item" onclick="playYouTube('كود_الحلقة_4', this)">
            <img src="https://via.placeholder.com/300x450/333/FFD700?text=الحلقة+4" alt="الحلقة 4">
            <div class="poster-title">الحلقة 4</div>
        </div>

    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const ytPlayer = document.getElementById('ytPlayer');
        
        function playChannel(url, btnElement) {
            ytPlayer.style.display = 'none';
            video.style.display = 'block';
            video.src = url;
            video.play();
        }

        function playYouTube(videoId, element) {
            video.style.display = 'none';
            video.pause();
            ytPlayer.style.display = 'block';
            // تم إضافة mute=1 لتشغيل الفيديو تلقائياً في الهواتف
            ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&mute=1`;
            
            // تمييز البوستر المختار
            const posters = document.querySelectorAll('.poster-item');
            posters.forEach(p => p.style.border = 'none');
            if(element) element.style.border = '2px solid #FFD700';
        }
    </script>
</body>
</html>
