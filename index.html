<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الزعيم IPTV | الفخم</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    
    :root {
        --gold: #FFD700;
        --dark: #0f0f0f;
        --card-bg: #1e1e1e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    
    body {
        background-color: var(--dark);
        color: #fff;
        overflow: hidden;
        height: 100vh;
        display: flex;
    }

    /* --- شاشة الترحيب --- */
    #splash-screen {
        position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
        justify-content: center; align-items: center; z-index: 9999; transition: opacity 1s ease-in-out;
    }
    .splash-logo { width: 200px; border-radius: 20px; margin-bottom: 20px; }
    .splash-title { color: var(--gold); font-size: 40px; font-weight: 900; }

    /* --- الشريط الجانبي --- */
    .sidebar {
        width: 250px; height: 100vh; background: #0a0a0a; border-left: 1px solid #222;
        display: flex; flex-direction: column; padding: 20px 0; overflow-y: auto; flex-shrink: 0;
        transition: all 0.3s ease-in-out; z-index: 100;
    }
    
    .sidebar.closed { margin-right: -250px; opacity: 0; }

    .sidebar h2 { color: var(--gold); text-align: center; margin-bottom: 20px; font-size: 22px; }
    .tab-btn {
        background: transparent; color: #aaa; border: none; padding: 15px 20px; font-size: 18px;
        text-align: right; cursor: pointer; transition: 0.3s; width: 100%; font-weight: bold;
        border-right: 4px solid transparent; white-space: nowrap;
    }
    .tab-btn:hover, .tab-btn:focus, .tab-btn.active {
        background: rgba(255, 215, 0, 0.1); color: var(--gold); border-right-color: var(--gold); outline: none;
    }

    /* --- المحتوى الرئيسي --- */
    .main-content {
        flex-grow: 1; height: 100vh; overflow-y: auto; padding: 20px; display: flex; flex-direction: column;
    }

    /* --- شريط البحث والتحكم --- */
    .top-bar { 
        display: flex; justify-content: space-between; align-items: center; 
        margin-bottom: 20px;
    }
    
    .toggle-menu-btn {
        background: #222; color: var(--gold); border: 1px solid var(--gold); 
        padding: 10px 15px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;
    }
    .toggle-menu-btn:hover { background: var(--gold); color: #000; }

    .search-box {
        width: 50%; max-width: 400px; padding: 12px 20px; font-size: 16px; border-radius: 30px;
        border: 1px solid #333; background: #1a1a1a; color: #fff; outline: none; text-align: center;
    }

    /* --- المشغل (تم إصلاحه ليظهر دائماً) --- */
    .player-container {
        background: #000; border-radius: 12px; overflow: hidden; 
        width: 100%; height: 400px; /* ارتفاع ثابت وواضح */
        border: 2px solid #333; margin-bottom: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        display: block; /* التأكد من أنه ليس مخفياً */
        position: relative;
    }
    
    video { 
        width: 100%; height: 100%; object-fit: contain; display: block;
    }
    iframe { 
        width: 100%; height: 100%; border: none; display: block;
    }
    
    #ytPlayer { display: none; }
    
    #status { 
        position: absolute; bottom: 15px; width: 100%; color: var(--gold); 
        font-size: 18px; font-weight: bold; text-align: center; text-shadow: 0 2px 4px #000; 
        pointer-events: none;
    }

    /* أزرار التحكم */
    .player-controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
    .ctrl-btn {
        background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 12px 25px;
        border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
    }
    .ctrl-btn:hover, .ctrl-btn:focus { background: var(--gold); color: #000; border-color: var(--gold); outline: none; }

    /* قسم المسلسل */
    .series-container {
        background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 20px;
        display: flex; align-items: center; gap: 15px;
    }
    .series-container h3 { color: var(--gold); font-size: 18px; white-space: nowrap; }
    .series-select {
        flex-grow: 1; padding: 12px; font-size: 16px; font-weight: bold; color: #000; 
        background: var(--gold); border: none; border-radius: 8px; cursor: pointer; outline: none;
    }

    /* شبكة البطاقات */
    .grid-container {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding-bottom: 30px;
    }

    .channel-card {
        background: var(--card-bg); border-radius: 12px; border: 1px solid #333; padding: 15px; 
        text-align: center; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center;
    }
    
    .channel-card:hover, .channel-card:focus {
        transform: translateY(-5px); border-color: var(--gold); background: #2a2a2a; outline: none;
    }

    .channel-logo { width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px; }
    .channel-name { font-size: 14px; font-weight: 700; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

    .loading-text { color: var(--gold); text-align: center; font-size: 20px; width: 100%; grid-column: 1 / -1; padding: 50px; }
</style>
</head>
<body>

<div id="splash-screen">
  <img src="63A5AFDB-C33D-4E90-8631-577AD940E645.png" alt="شعار الزعيم" class="splash-logo">
  <div class="splash-title">👑 الزعيم IPTV 👑</div>
</div>

<div id="app-content" style="display:none; width: 100%; height: 100%;">
  
  <div class="sidebar" id="sidebar">
      <h2>التصنيفات</h2>
  </div>

  <div class="main-content">
      <div class="top-bar">
          <button class="toggle-menu-btn" onclick="toggleSidebar()">☰ القائمة</button>
          <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن قناة..." oninput="renderGrid()">
      </div>

      <!-- المشغل (شاشة العرض) -->
      <div class="player-container">
        <video id="videoPlayer" controls autoplay playsinline></video>
        <iframe id="ytPlayer" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        <div id="status">جاري التحميل...</div>
      </div>
      
      <div class="player-controls">
          <button class="ctrl-btn" onclick="zap(-1)">⏮ السابقة</button>
          <button class="ctrl-btn" onclick="zap(1)">التالية ⏭</button>
          <button class="ctrl-btn" onclick="toggleFullScreen()">⛶ ملء الشاشة</button>
      </div>

      <div class="series-container">
          <h3>🎬 مسلسل الإمام أحمد بن حنبل</h3>
          <select class="series-select" id="episodeSelect">
            <option value="" disabled selected>-- اختر الحلقة --</option>
            <option value="rAOJZMPjxLc">الحلقة 1</option>
            <option value="e8jh0NfoUxQ">الحلقة 2</option>
            <option value="nN5A1RGBF3c">الحلقة 3</option>
            <option value="UI6qR865ehg">الحلقة 4</option>
            <option value="8NJE5yb_lqw">الحلقة 5</option>
            <option value="g5FrTDkth1I">الحلقة 6</option>
            <option value="_9Q7Nf1Ui7Q">الحلقة 7</option>
            <option value="zNcIpZu5Yhw">الحلقة 8</option>
            <option value="AAMwQCeeVZI">الحلقة 9</option>
            <option value="dDHnvmGSemw">الحلقة 10</option>
            <option value="AjS0rtLjX8A">الحلقة 11</option>
            <option value="dAtMZ-U9taA">الحلقة 12</option>
            <option value="EtE8uK22X-w">الحلقة 13</option>
            <option value="qsNdkdS81Q0">الحلقة 14</option>
            <option value="8I5TxMoAcOQ">الحلقة 15</option>
            <option value="5pPYjrfbkuw">الحلقة 16</option>
            <option value="ty516Uh3xP8">الحلقة 17</option>
            <option value="P82rEDYDozU">الحلقة 18</option>
            <option value="tq_SBbmJJ8A">الحلقة 19</option>
            <option value="d1fns8LG3uo">الحلقة 20</option>
            <option value="V6yPHEXN1fg">الحلقة 21</option>
            <option value="VtJuAWosqM4">الحلقة 22</option>
            <option value="hNXkpfyPi_Q">الحلقة 23</option>
            <option value="zCJWST2u6Vw">الحلقة 24</option>
            <option value="E41YElDToHw">الحلقة 25</option>
            <option value="JHgGELihZjs">الحلقة 26</option>
            <option value="ofkmmFBkx4o">الحلقة 27</option>
            <option value="4thw1O2Ql-k">الحلقة 28</option>
            <option value="D-eeoZP5Ido">الحلقة 29</option>
            <option value="RDPSiRV4TxY">الحلقة 30 (الأخيرة)</option>
          </select>
      </div>

      <div class="grid-container" id="channelGrid">
          <div class="loading-text">جاري جلب القنوات... يرجى الانتظار</div>
      </div>
  </div>

</div>

<script>
    const video = document.getElementById('videoPlayer');
    const ytPlayer = document.getElementById('ytPlayer');
    const grid = document.getElementById('channelGrid');
    const searchInput = document.getElementById('searchInput');
    const sidebar = document.getElementById('sidebar');
    const statusEl = document.getElementById('status');
    const episodeSelect = document.getElementById('episodeSelect');
    
    let allChannels = [];
    let currentCategory = 'all';
    let currentPlayIndex = 0;
    let hls = null;

    const categories = [
        { id: 'all', name: '🏠 الرئيسية' },
        { id: 'سوريا', name: '🇸🇾 سوريا' },
        { id: 'mbc', name: 'MBC' },
        { id: 'أخبار', name: '📰 أخبار' },
        { id: 'رياضة', name: '⚽ رياضة' },
        { id: 'أفلام ومسلسلات', name: '🎬 أفلام ومسلسلات' },
        { id: 'أطفال', name: '🧸 أطفال' },
        { id: 'دينية', name: '🕌 دينية' },
        { id: 'موسيقى', name: '🎵 موسيقى' },
        { id: 'منوعة', name: '🌟 منوعة' }
    ];

    const baseChannels = [
        { name: "التلفزيون السوري", url: "https://svs.itworkscdn.net/syriatvlive/syriatv.smil/playlist_dvr.m3u8", logo: "https://upload.wikimedia.org/wikipedia/ar/thumb/1/1a/Syria_TV_logo.png/200px-Syria_TV_logo.png", cat: "سوريا" },
        { name: "سوريا دراما", url: "https://svs.itworkscdn.net/syriadramalive/syriadrama.smil/playlist_dvr.m3u8", logo: "https://upload.wikimedia.org/wikipedia/ar/thumb/9/9f/Syria_Drama_logo.png/200px-Syria_Drama_logo.png", cat: "سوريا" },
        { name: "الأخبارية السورية", url: "https://svs.itworkscdn.net/syrianews/syrianews.smil/playlist_dvr.m3u8", logo: "https://upload.wikimedia.org/wikipedia/ar/thumb/e/e1/Syria_News_logo.png/200px-Syria_News_logo.png", cat: "سوريا" }
    ];

    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'flex';
                
                allChannels = baseChannels;
                buildSidebar();
                renderGrid();
                playChannel(0);
                
                loadAllPlaylists();
            }, 1000);
        }, 2500);
    });

    function toggleSidebar() {
        sidebar.classList.toggle('closed');
    }

    function loadAllPlaylists() {
        const playlists = [
            { url: "https://iptv-org.github.io/iptv/countries/sy.m3u", cat: 'سوريا' },
            { url: "https://iptv-org.github.io/iptv/regions/arab.m3u", cat: 'منوعة' }
        ];
        const moviesUrl = "https://www.free-codecs.com/app/iptv-finder/data/ready/movies.m3u";

        Promise.all(playlists.map(p =>
            fetch(p.url, { cache: 'no-store' }).then(r => r.text()).then(t => parseM3U(t, p.cat)).catch(() => [])
        )).then(results => {
            let seen = new Set(allChannels.map(c => c.url));
            results.flat().forEach(c => {
                if (!seen.has(c.url)) { seen.add(c.url); allChannels.push(c); }
            });
            renderGrid();
        });

        fetch(moviesUrl, { cache: 'no-store' })
            .then(r => r.text())
            .then(t => {
                let movies = parseM3U(t, 'أفلام ومسلسلات');
                let seen = new Set(allChannels.map(c => c.url));
                movies.forEach(m => {
                    if (!seen.has(m.url)) { seen.add(m.url); allChannels.push(m); }
                });
                renderGrid();
            }).catch(() => console.log("فشل جلب الأفلام."));
    }

    function parseM3U(text, defaultCat) {
        const out = [];
        let name = '', logo = '', group = '';
        text.split('\n').forEach(raw => {
            const line = raw.trim();
            if (line.startsWith('#EXTINF:')) {
                const l = line.match(/tvg-logo="([^"]*)"/);
                const g = line.match(/group-title="([^"]*)"/);
                logo = l && l[1] ? l[1] : '';
                group = g ? g[1] : '';
                const c = line.lastIndexOf(',');
                name = c !== -1 ? line.substring(c + 1).trim() : '';
            } else if (line.startsWith('http') && name) {
                let cat = defaultCat;
                const lowerName = name.toLowerCase();
                const lowerGroup = group.toLowerCase();
                
                if (name.includes('MBC') || /mbc/i.test(name)) cat = 'mbc';
                else if (lowerGroup.includes('news') || name.includes('أخبار') || name.includes('إخبار')) cat = 'أخبار';
                else if (lowerGroup.includes('sport') || name.includes('رياض') || /bein/i.test(name)) cat = 'رياضة';
                else if (lowerGroup.includes('kid') || lowerGroup.includes('animation') || name.includes('أطفال') || name.includes('كرتون')) cat = 'أطفال';
                else if (lowerGroup.includes('relig') || name.includes('قرآن') || name.includes('إسلام')) cat = 'دينية';
                else if (lowerGroup.includes('music') || name.includes('أغاني') || name.includes('موسيقى')) cat = 'موسيقى';
                else if (lowerGroup.includes('movie') || lowerGroup.includes('series') || name.includes('دراما') || name.includes('أفلام')) cat = 'أفلام ومسلسلات';
                
                out.push({ name, url: line, logo: logo, cat: cat });
                name = ''; logo = ''; group = '';
            }
        });
        return out;
    }

    function buildSidebar() {
        sidebar.innerHTML = '<h2>التصنيفات</h2>';
        categories.forEach(cat => {
            let btn = document.createElement('button');
            btn.className = `tab-btn ${cat.id === 'all' ? 'active' : ''}`;
            btn.textContent = cat.name;
            btn.onclick = () => {
                currentCategory = cat.id;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderGrid();
            };
            sidebar.appendChild(btn);
        });
    }

    function renderGrid() {
        grid.innerHTML = '';
        let query = searchInput.value.toLowerCase();
        
        let filtered = allChannels.filter(c => {
            let matchCat = currentCategory === 'all' || c.cat === currentCategory;
            let matchSearch = c.name.toLowerCase().includes(query);
            return matchCat && matchSearch;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<div class="loading-text">لا توجد نتائج مطابقة</div>';
            return;
        }

        filtered.slice(0, 100).forEach((ch) => {
            let originalIndex = allChannels.indexOf(ch);
            let div = document.createElement('div');
            div.className = 'channel-card';
            div.tabIndex = 0;
            
            div.innerHTML = `
                <img src="${ch.logo || 'https://via.placeholder.com/70/222/FFD700?text=TV'}" class="channel-logo" onerror="this.src='https://via.placeholder.com/70/222/FFD700?text=TV'">
                <div class="channel-name">${ch.name}</div>
            `;
            
            div.onclick = () => playChannel(originalIndex);
            grid.appendChild(div);
        });
    }

    function playChannel(index) {
        if(index < 0 || index >= allChannels.length) return;
        
        currentPlayIndex = index;
        let ch = allChannels[index];
        
        ytPlayer.style.display = 'none';
        video.style.display = 'block';
        
        if(hls) { hls.destroy(); hls = null; }
        video.pause();
        
        statusEl.textContent = "جاري التحميل...";
        
        if (Hls.isSupported() && ch.url.includes('.m3u8')) {
            hls = new Hls();
            hls.loadSource(ch.url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
                statusEl.textContent = ch.name;
                setTimeout(() => { if(statusEl.textContent === ch.name) statusEl.textContent = ""; }, 4000);
            });
            hls.on(Hls.Events.ERROR, () => {
                statusEl.textContent = "⚠️ القناة لا تعمل حالياً";
            });
        } else {
            video.src = ch.url;
            video.play().catch(e => statusEl.textContent = "⚠️ القناة لا تعمل حالياً");
        }
    }

    function zap(dir) {
        let next = currentPlayIndex + dir;
        if(next >= allChannels.length) next = 0;
        if(next < 0) next = allChannels.length - 1;
        playChannel(next);
    }

    function toggleFullScreen() {
        let box = document.querySelector('.player-container');
        if (!document.fullscreenElement) {
            if (box.requestFullscreen) box.requestFullscreen();
            else if (box.webkitRequestFullscreen) box.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    episodeSelect.addEventListener('change', function() {
        let id = this.value;
        if (!id) return;
        if (hls) { hls.destroy(); hls = null; }
        video.pause();
        video.style.display = 'none';
        statusEl.textContent = '';
        ytPlayer.style.display = 'block';
        ytPlayer.src = 'https://www.youtube.com/embed/' + encodeURIComponent(id) + '?autoplay=1&rel=0&mute=1';
    });
</script>
</body>
</html>
