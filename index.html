<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الزعيم IPTV</title>
    <style>
        /* --- تصميم شاشة الترحيب --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; transition: opacity 1s ease-in-out;
        }
        .splash-image { width: 70%; max-width: 300px; border-radius: 20px; box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); animation: zoomIn 2s ease-in-out infinite alternate; margin-bottom: 20px; }
        .splash-title { color: #FFD700; font-size: 36px; font-weight: bold; text-shadow: 0 0 20px rgba(255, 215, 0, 0.8); animation: pulse 2s infinite; text-align: center; }
        @keyframes zoomIn { from { transform: scale(1); } to { transform: scale(1.05); } }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

        /* --- التصميم العام --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('IMG_6458.jpeg'); background-color: #0f0f0f; 
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; text-align: center; margin: 0; padding: 20px 10px; overflow-x: hidden;
        }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: -1; }

        h1 { color: #FFD700; font-size: 28px; margin-bottom: 20px; }
        h2 { color: #FFD700; text-align: right; font-size: 20px; margin-top: 30px; border-right: 4px solid #FFD700; padding-right: 15px; }

        .player-wrapper { max-width: 500px; margin: 0 auto 20px auto; position: relative; }
        .player-container { background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #333; position: relative; padding-top: 56.25%; }
        video, iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        #ytPlayer { display: none; }

        .player-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 10px; background: rgba(30, 30, 30, 0.9); border-radius: 8px; border: 1px solid #444; }
        .ctrl-btn { background-color: #FFD700; color: #000; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .sleep-timer-select { background-color: #222; color: #FFD700; border: 1px solid #FFD700; padding: 10px; border-radius: 5px; font-weight: bold; }

        .selector-container { background: rgba(30, 30, 30, 0.95); padding: 20px; border-radius: 12px; max-width: 800px; margin: 20px auto; border: 1px solid #444; }
        
        /* --- تصميم زر البحث الذكي --- */
        .fake-search-btn {
            width: 95%; padding: 15px; font-size: 16px; border-radius: 8px; border: 2px solid #FFD700;
            background-color: #111; color: #FFD700; margin-bottom: 15px; cursor: pointer; display: block; text-align: center; font-weight: bold;
        }
        .fake-search-btn:focus, .fake-search-btn:hover { background-color: #FFD700; color: #000; outline: none; }
        
        .search-box {
            width: 95%; padding: 15px; font-size: 16px; border-radius: 8px; border: 2px solid #FFD700;
            background-color: #222; color: white; margin-bottom: 15px; display: none; text-align: center; outline: none;
        }

        /* --- قائمة القنوات الموحدة --- */
        .channel-list-container {
            max-height: 500px; overflow-y: auto; background-color: #111; border: 1px solid #333; border-radius: 8px; scroll-behavior: smooth;
        }
        .channel-item {
            display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #222; cursor: pointer; outline: none; transition: 0.2s;
        }
        .channel-item:hover, .channel-item:focus { background-color: #FFD700; }
        .channel-item:hover .channel-name, .channel-item:focus .channel-name { color: #000; font-weight: bold; }
        
        .channel-logo { width: 50px; height: 50px; object-fit: contain; margin-left: 15px; background-color: white; border-radius: 8px; padding: 3px; }
        .channel-name { font-size: 18px; font-weight: bold; color: #ddd; }

        /* --- قائمة المسلسل --- */
        .series-select { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: #FFD700; background-color: #111; border: 2px solid #FFD700; border-radius: 8px; cursor: pointer; text-align: center; outline: none; }
    </style>
</head>
<body>

    <!-- شاشة الترحيب -->
    <div id="splash-screen">
        <img src="63A5AFDB-C33D-4E90-8631-577AD940E645.png" alt="شعار الزعيم" class="splash-image">
        <div class="splash-title">👑 الزعيم IPTV 👑</div>
    </div>

    <!-- محتوى التطبيق -->
    <div id="app-content" style="display: none;">
        <h1>👑 الزعيم IPTV 👑</h1>
        
        <!-- المشغل -->
        <div class="player-wrapper">
            <div class="player-container" id="playerBox">
                <video id="videoPlayer" controls autoplay></video>
                <iframe id="ytPlayer" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
            </div>
            <div class="player-controls">
                <button class="ctrl-btn" onclick="toggleFullScreen()">⛶ ملء الشاشة</button>
                <select class="sleep-timer-select" id="sleepTimer" onchange="setSleepTimer(this.value)">
                    <option value="0">⏱️ مؤقت النوم (إيقاف)</option>
                    <option value="15">15 دقيقة</option>
                    <option value="30">30 دقيقة</option>
                    <option value="60">60 دقيقة</option>
                </select>
            </div>
        </div>

        <!-- قسم القنوات الموحد -->
        <h2>📺 اختيار القنوات</h2>
        <div class="selector-container">
            <!-- زر البحث الذكي -->
            <div class="fake-search-btn" id="fakeSearchBtn" tabindex="0" onclick="activateSearch()">🔍 اضغط هنا للبحث عن قناة...</div>
            <input type="text" id="searchInput" class="search-box" placeholder="اكتب اسم القناة..." onkeyup="filterChannels()" onblur="hideSearchKeyboard()">
            
            <!-- قائمة القنوات -->
            <div class="channel-list-container" id="channelListContainer">
                <!-- سيتم تعبئة القنوات هنا تلقائياً بواسطة الجافاسكريبت -->
            </div>
        </div>

        <!-- قسم المسلسل -->
        <h2>🎬 مسلسل الإمام أحمد بن حنبل</h2>
        <div class="selector-container">
            <select class="series-select" id="episodeSelect" onchange="playYouTube(this.value)">
                <option value="" disabled selected>-- اختر الحلقة --</option>
                <option value="rAOJZMPjxLc">الحلقة 1</option>
                <option value="e8jh0NfoUxQ">الحلقة 2</option>
                <option value="nN5A1RGBF3c">الحلقة 3</option>
                <option value="UI6qR865ehg">الحلقة 4</option>
                <option value="8NJE5yb_lqw">الحلقة 5</option>
                <option value="g5FrTDkth1I">الحلقة 6</option>
                <option value="_9Q7Nf1Ui7Q">الحلقة 7</option>
                <option value="zNcIpZu5Yhw">الحلقة 8</option>
                <option value="AAMwQCeeVZI">الحلقة 9</option>
                <option value="dDHnvmGSemw">الحلقة 10</option>
                <option value="AjS0rtLjX8A">الحلقة 11</option>
                <option value="dAtMZ-U9taA">الحلقة 12</option>
                <option value="EtE8uK22X-w">الحلقة 13</option>
                <option value="qsNdkdS81Q0">الحلقة 14</option>
                <option value="8I5TxMoAcOQ">الحلقة 15</option>
                <option value="5pPYjrfbkuw">الحلقة 16</option>
                <option value="ty516Uh3xP8">الحلقة 17</option>
                <option value="P82rEDYDozU">الحلقة 18</option>
                <option value="tq_SBbmJJ8A">الحلقة 19</option>
                <option value="d1fns8LG3uo">الحلقة 20</option>
                <option value="V6yPHEXN1fg">الحلقة 21</option>
                <option value="VtJuAWosqM4">الحلقة 22</option>
                <option value="hNXkpfyPi_Q">الحلقة 23</option>
                <option value="zCJWST2u6Vw">الحلقة 24</option>
                <option value="E41YElDToHw">الحلقة 25</option>
                <option value="JHgGELihZjs">الحلقة 26</option>
                <option value="ofkmmFBkx4o">الحلقة 27</option>
                <option value="4thw1O2Ql-k">الحلقة 28</option>
                <option value="D-eeoZP5Ido">الحلقة 29</option>
                <option value="RDPSiRV4TxY">الحلقة 30 (الأخيرة)</option>
            </select>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const ytPlayer = document.getElementById('ytPlayer');
        const episodeSelect = document.getElementById('episodeSelect');
        const searchInput = document.getElementById('searchInput');
        const fakeSearchBtn = document.getElementById('fakeSearchBtn');
        const channelListContainer = document.getElementById('channelListContainer');
        const playerBox = document.getElementById('playerBox');
        
        // مصفوفة تحتوي على جميع القنوات التي تريدها
        const allChannels = [
            // القنوات السورية
            { name: "التلفزيون السوري", url: "https://svs.itworkscdn.net/syriatvlive/syriatv.smil/playlist_dvr.m3u8", logo: "https://i.imgur.com/3Vq5qJb.jpg" },
            { name: "سوريا دراما", url: "https://svs.itworkscdn.net/syriadramalive/syriadrama.smil/playlist_dvr.m3u8", logo: "https://i.imgur.com/z8G0w6x.jpg" },
            { name: "الأخبارية السورية", url: "https://svs.itworkscdn.net/syrianews/syrianews.smil/playlist_dvr.m3u8", logo: "https://i.imgur.com/7p4n5r2.jpg" },
            
            // قنوات أخبار عربية (يمكنك إضافة المزيد هنا بنفس الطريقة)
            { name: "الجزيرة", url: "https://live-hls-web-aje.getaj.net/AJE/01.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/e/e9/Al_Jazeera_English_Logo.svg/200px-Al_Jazeera_English_Logo.svg.png" },
            { name: "العربية", url: "https://live.alarabiya.net/alarabiapublish/alarabiya.smil/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/0/09/Al_Arabiya_Logo.svg/200px-Al_Arabiya_Logo.svg.png" },
            { name: "سكاي نيوز عربية", url: "https://stream.skynewsarabia.com/hls/sna.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Sky_News_Arabia_Logo.png/200px-Sky_News_Arabia_Logo.png" },
            { name: "بي بي سي عربي", url: "https://vs-cmaf-pushb-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_arabic_tv/pc_hd_abr_v2_ww.mpd", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9b/BBC_Arabic_Logo.png/200px-BBC_Arabic_Logo.png" },
            { name: "فرانس 24 عربي", url: "https://live.francetv.fr/france24-arabe/index.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/France24_Logo_2013.svg/200px-France24_Logo_2013.svg.png" }
        ];

        let sleepTimeout;

        // إخفاء شاشة الترحيب وتشغيل أول قناة
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.getElementById('app-content').style.display = 'block';
                    
                    // تشغيل القناة الأولى تلقائياً
                    ytPlayer.style.display = 'none';
                    video.style.display = 'block';
                    video.src = allChannels[0].url;
                    video.play();
                    
                    // عرض القنوات في القائمة
                    renderChannels(allChannels);
                }, 1000); 
            }, 3000); 
        });

        // --- التمرير التلقائي بالريموت ---
        document.addEventListener('focusin', function(e) {
            if (e.target.classList.contains('channel-item')) {
                e.target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        });

        // --- التحكم في زر البحث ---
        function activateSearch() {
            fakeSearchBtn.style.display = 'none';
            searchInput.style.display = 'block';
            searchInput.focus(); // فتح الكيبورد فقط عند الضغط
        }

        function hideSearchKeyboard() {
            setTimeout(() => {
                searchInput.style.display = 'none';
                fakeSearchBtn.style.display = 'block';
                fakeSearchBtn.focus();
            }, 200);
        }

        // --- دوال المشاهدة ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (playerBox.requestFullscreen) playerBox.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function setSleepTimer(minutes) {
            clearTimeout(sleepTimeout);
            if (minutes > 0) {
                let ms = minutes * 60 * 1000;
                sleepTimeout = setTimeout(() => {
                    video.pause();
                    ytPlayer.src = ""; 
                    alert("تم إيقاف التشغيل بواسطة مؤقت النوم.");
                    document.getElementById('sleepTimer').value = "0"; 
                }, ms);
            }
        }

        function playM3UChannel(url) {
            if(!url) return;
            ytPlayer.style.display = 'none';
            video.style.display = 'block';
            video.src = url;
            video.play();
            episodeSelect.selectedIndex = 0;
            window.scrollTo({ top: 0, behavior: 'smooth' }); // العودة لأعلى الصفحة لمشاهدة الفيديو
        }

        function playYouTube(videoId) {
            if(!videoId) return; 
            video.style.display = 'none';
            video.pause(); 
            ytPlayer.style.display = 'block';
            ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&mute=1`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- عرض وتصفية القنوات ---
        function renderChannels(channelsToRender) {
            channelListContainer.innerHTML = '';
            if (channelsToRender.length === 0) {
                channelListContainer.innerHTML = '<p style="padding:20px; color:#aaa;">لا توجد قنوات مطابقة للبحث.</p>';
                return;
            }
            channelsToRender.forEach(channel => {
                let item = document.createElement('div');
                item.className = 'channel-item';
                item.tabIndex = 0;
                item.onclick = function() { playM3UChannel(channel.url); };
                item.innerHTML = `
                    <img src="${channel.logo}" class="channel-logo" onerror="this.src='https://via.placeholder.com/50/333/FFD700?text=TV'">
                    <span class="channel-name">${channel.name}</span>
                `;
                channelListContainer.appendChild(item);
            });
        }

        function filterChannels() {
            const filter = searchInput.value.toLowerCase();
            const filtered = allChannels.filter(channel => channel.name.toLowerCase().includes(filter));
            renderChannels(filtered);
        }
    </script>
</body>
</html>
