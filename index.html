<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الزعيم IPTV | الفخم</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    
    :root {
        --gold: #FFD700;
        --dark: #0f0f0f;
        --card-bg: rgba(30, 30, 30, 0.7);
        --glass: rgba(20, 20, 20, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    
    body {
        background-color: var(--dark);
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(255, 215, 0, 0.05) 0%, transparent 40%);
        color: #fff;
        overflow: hidden; /* لمنع التمرير العشوائي */
        height: 100vh;
        display: flex;
    }

    /* --- شاشة الترحيب السينمائية --- */
    #splash-screen {
        position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
        justify-content: center; align-items: center; z-index: 9999; transition: all 1s ease-in-out;
    }
    .splash-logo { width: 250px; animation: pulse 2s infinite alternate; filter: drop-shadow(0 0 30px rgba(255,215,0,0.5)); }
    .splash-title { color: var(--gold); font-size: 50px; font-weight: 900; letter-spacing: 2px; margin-top: 20px; animation: slideUp 1s ease-out; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* --- الشريط الجانبي (Sidebar) --- */
    .sidebar {
        width: 250px; height: 100vh; background: rgba(10, 10, 10, 0.95); border-left: 1px solid #222;
        display: flex; flex-direction: column; padding: 20px 0; overflow-y: auto; flex-shrink: 0;
    }
    .sidebar h2 { color: var(--gold); text-align: center; margin-bottom: 20px; font-size: 24px; }
    .tab-btn {
        background: transparent; color: #aaa; border: none; padding: 15px 20px; font-size: 18px;
        text-align: right; cursor: pointer; transition: 0.3s; width: 100%; font-weight: bold;
        border-right: 4px solid transparent;
    }
    .tab-btn:hover, .tab-btn:focus, .tab-btn.active {
        background: rgba(255, 215, 0, 0.1); color: var(--gold); border-right-color: var(--gold); outline: none;
    }

    /* --- المحتوى الرئيسي --- */
    .main-content {
        flex-grow: 1; height: 100vh; overflow-y: auto; padding: 20px 40px; display: flex; flex-direction: column;
    }

    /* شريط البحث */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .search-box {
        width: 400px; padding: 12px 20px; font-size: 16px; border-radius: 30px;
        border: 1px solid #333; background: #1a1a1a; color: #fff; outline: none; transition: 0.3s;
    }
    .search-box:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }

    /* المشغل */
    .player-container {
        background: #000; border-radius: 16px; overflow: hidden; position: relative;
        padding-top: 45%; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.8); margin-bottom: 30px;
    }
    video, iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    #status { position: absolute; inset: auto 0 10px 0; color: var(--gold); font-size: 18px; font-weight: bold; text-align: center; pointer-events: none; text-shadow: 0 2px 4px #000; }

    /* شبكة البطاقات */
    .grid-container {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px;
    }

    .channel-card {
        background: var(--card-bg); backdrop-filter: blur(10px); border-radius: 12px;
        border: 1px solid #333; padding: 20px; text-align: center; cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    
    .channel-card:hover, .channel-card:focus {
        transform: translateY(-10px) scale(1.05); border-color: var(--gold);
        box-shadow: 0 15px 40px rgba(255, 215, 0, 0.15); background: #222; outline: none; z-index: 10;
    }

    .channel-logo { width: 80px; height: 80px; object-fit: contain; margin-bottom: 15px; transition: 0.3s; }
    .channel-card:hover .channel-logo { transform: scale(1.1); }
    
    .channel-name { font-size: 15px; font-weight: 700; color: #ddd; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .loading-text { color: var(--gold); text-align: center; font-size: 22px; width: 100%; grid-column: 1 / -1; padding: 50px; }

    /* شريط التمرير الفخم */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

</style>
</head>
<body>

<div id="splash-screen">
  <img src="63A5AFDB-C33D-4E90-8631-577AD940E645.png" alt="شعار الزعيم" class="splash-logo">
  <div class="splash-title">👑 الزعيم IPTV 👑</div>
</div>

<div id="app-content" style="display:none; width: 100%; height: 100%; display: flex;">
  
  <!-- الشريط الجانبي للتصنيفات -->
  <div class="sidebar" id="sidebar">
      <h2>التصنيفات</h2>
      <!-- سيتم ملؤها بالجافاسكريبت -->
  </div>

  <!-- المحتوى الرئيسي -->
  <div class="main-content">
      <div class="top-bar">
          <h2 style="color: var(--gold); margin:0;">تصفح القنوات</h2>
          <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن قناة أو فيلم..." oninput="renderGrid()">
      </div>

      <div class="player-container" id="playerBox">
        <video id="videoPlayer" controls autoplay playsinline></video>
        <div id="status">جاري التحميل...</div>
      </div>

      <div class="grid-container" id="channelGrid">
          <div class="loading-text">جاري جلب القنوات... يرجى الانتظار</div>
      </div>
  </div>

</div>

<script>
    const video = document.getElementById('videoPlayer');
    const grid = document.getElementById('channelGrid');
    const searchInput = document.getElementById('searchInput');
    const sidebar = document.getElementById('sidebar');
    const statusEl = document.getElementById('status');
    
    let allChannels = [];
    let currentCategory = 'all';
    let currentPlayIndex = 0;
    let hls = null;

    const categories = [
        { id: 'all', name: '🏠 الرئيسية' },
        { id: 'سوريا', name: '🇸🇾 سوريا' },
        { id: 'mbc', name: 'MBC' },
        { id: 'أخبار', name: '📰 أخبار' },
        { id: 'رياضة', name: '⚽ رياضة' },
        { id: 'أفلام ومسلسلات', name: '🎬 أفلام ومسلسلات' },
        { id: 'أطفال', name: '🧸 أطفال' },
        { id: 'دينية', name: '🕌 دينية' },
        { id: 'موسيقى', name: '🎵 موسيقى' },
        { id: 'منوعة', name: '🌟 منوعة' }
    ];

    const baseChannels = [
        { name: "التلفزيون السوري", url: "https://svs.itworkscdn.net/syriatvlive/syriatv.smil/playlist_dvr.m3u8", logo: "https://upload.wikimedia.org/wikipedia/ar/thumb/1/1a/Syria_TV_logo.png/200px-Syria_TV_logo.png", cat: "سوريا" },
        { name: "سوريا دراما", url: "https://svs.itworkscdn.net/syriadramalive/syriadrama.smil/playlist_dvr.m3u8", logo: "https://upload.wikimedia.org/wikipedia/ar/thumb/9/9f/Syria_Drama_logo.png/200px-Syria_Drama_logo.png", cat: "سوريا" },
        { name: "الأخبارية السورية", url: "https://svs.itworkscdn.net/syrianews/syrianews.smil/playlist_dvr.m3u8", logo: "https://upload.wikimedia.org/wikipedia/ar/thumb/e/e1/Syria_News_logo.png/200px-Syria_News_logo.png", cat: "سوريا" }
    ];

    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'flex';
                
                allChannels = baseChannels;
                buildSidebar();
                renderGrid();
                playChannel(0);
                
                loadAllPlaylists();
            }, 1000);
        }, 3000);
    });

    function loadAllPlaylists() {
        const playlists = [
            { url: "https://iptv-org.github.io/iptv/countries/sy.m3u", cat: 'سوريا' },
            { url: "https://iptv-org.github.io/iptv/regions/arab.m3u", cat: 'منوعة' }
        ];
        const moviesUrl = "https://www.free-codecs.com/app/iptv-finder/data/ready/movies.m3u";

        Promise.all(playlists.map(p =>
            fetch(p.url, { cache: 'no-store' }).then(r => r.text()).then(t => parseM3U(t, p.cat)).catch(() => [])
        )).then(results => {
            let seen = new Set(allChannels.map(c => c.url));
            results.flat().forEach(c => {
                if (!seen.has(c.url)) { seen.add(c.url); allChannels.push(c); }
            });
            renderGrid();
        });

        fetch(moviesUrl, { cache: 'no-store' })
            .then(r => r.text())
            .then(t => {
                let movies = parseM3U(t, 'أفلام ومسلسلات');
                let seen = new Set(allChannels.map(c => c.url));
                movies.forEach(m => {
                    if (!seen.has(m.url)) { seen.add(m.url); allChannels.push(m); }
                });
                renderGrid();
            }).catch(() => console.log("فشل جلب الأفلام."));
    }

    function parseM3U(text, defaultCat) {
        const out = [];
        let name = '', logo = '', group = '';
        text.split('\n').forEach(raw => {
            const line = raw.trim();
            if (line.startsWith('#EXTINF:')) {
                const l = line.match(/tvg-logo="([^"]*)"/);
                const g = line.match(/group-title="([^"]*)"/);
                logo = l && l[1] ? l[1] : '';
                group = g ? g[1] : '';
                const c = line.lastIndexOf(',');
                name = c !== -1 ? line.substring(c + 1).trim() : '';
            } else if (line.startsWith('http') && name) {
                let cat = defaultCat;
                const lowerName = name.toLowerCase();
                const lowerGroup = group.toLowerCase();
                
                if (name.includes('MBC') || /mbc/i.test(name)) cat = 'mbc';
                else if (lowerGroup.includes('news') || name.includes('أخبار') || name.includes('إخبار')) cat = 'أخبار';
                else if (lowerGroup.includes('sport') || name.includes('رياض') || /bein/i.test(name)) cat = 'رياضة';
                else if (lowerGroup.includes('kid') || lowerGroup.includes('animation') || name.includes('أطفال') || name.includes('كرتون')) cat = 'أطفال';
                else if (lowerGroup.includes('relig') || name.includes('قرآن') || name.includes('إسلام')) cat = 'دينية';
                else if (lowerGroup.includes('music') || name.includes('أغاني') || name.includes('موسيقى')) cat = 'موسيقى';
                else if (lowerGroup.includes('movie') || lowerGroup.includes('series') || name.includes('دراما') || name.includes('أفلام')) cat = 'أفلام ومسلسلات';
                
                out.push({ name, url: line, logo: logo, cat: cat });
                name = ''; logo = ''; group = '';
            }
        });
        return out;
    }

    function buildSidebar() {
        // إبقاء العنوان
        sidebar.innerHTML = '<h2>التصنيفات</h2>';
        categories.forEach(cat => {
            let btn = document.createElement('button');
            btn.className = `tab-btn ${cat.id === 'all' ? 'active' : ''}`;
            btn.textContent = cat.name;
            btn.onclick = () => {
                currentCategory = cat.id;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderGrid();
            };
            sidebar.appendChild(btn);
        });
    }

    function renderGrid() {
        grid.innerHTML = '';
        let query = searchInput.value.toLowerCase();
        
        let filtered = allChannels.filter(c => {
            let matchCat = currentCategory === 'all' || c.cat === currentCategory;
            let matchSearch = c.name.toLowerCase().includes(query);
            return matchCat && matchSearch;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<div class="loading-text">لا توجد نتائج مطابقة</div>';
            return;
        }

        filtered.slice(0, 100).forEach((ch) => {
            let originalIndex = allChannels.indexOf(ch);
            let div = document.createElement('div');
            div.className = 'channel-card';
            div.tabIndex = 0;
            
            div.innerHTML = `
                <img src="${ch.logo || 'https://via.placeholder.com/80/222/FFD700?text=TV'}" class="channel-logo" onerror="this.src='https://via.placeholder.com/80/222/FFD700?text=TV'">
                <div class="channel-name">${ch.name}</div>
            `;
            
            div.onclick = () => playChannel(originalIndex);
            grid.appendChild(div);
        });
    }

    function playChannel(index) {
        if(index < 0 || index >= allChannels.length) return;
        
        currentPlayIndex = index;
        let ch = allChannels[index];
        
        if(hls) { hls.destroy(); hls = null; }
        video.pause();
        
        statusEl.textContent = "جاري التحميل...";
        
        if (Hls.isSupported() && ch.url.includes('.m3u8')) {
            hls = new Hls();
            hls.loadSource(ch.url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
                statusEl.textContent = ch.name;
                setTimeout(() => { if(statusEl.textContent === ch.name) statusEl.textContent = ""; }, 4000);
            });
            hls.on(Hls.Events.ERROR, () => {
                statusEl.textContent = "⚠️ القناة لا تعمل حالياً";
            });
        } else {
            video.src = ch.url;
            video.play().catch(e => statusEl.textContent = "⚠️ القناة لا تعمل حالياً");
        }
    }

    function applyFilters() {
        renderGrid();
    }
</script>
</body>
</html>
