<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزعيم - IPTV</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { 
            color: #FFD700; /* لون ذهبي يناسب اسم "الزعيم" */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .controls { margin: 20px 0; }
        select {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #FFD700;
            background-color: #222;
            color: white;
            width: 85%;
            max-width: 350px;
            font-weight: bold;
        }
        .player-container {
            max-width: 800px;
            margin: 0 auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            border: 2px solid #333;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h1>👑 الزعيم IPTV 👑</h1>
    <p>أهلاً بك في برنامجك الخاص</p>
    
    <!-- القائمة المنسدلة -->
    <div class="controls">
        <select id="channelSelect">
            <option value="" disabled selected>-- اختر القناة --</option>
            
            <!-- القنوات السورية -->
            <optgroup label="القنوات السورية">
                <option value="http://82.137.248.16:1935/Sat/SatLive3/playlist.m3u8">التلفزيون السوري</option>
                <option value="https://svs.itworkscdn.net/syriatvlive/syriatv.smil/playlist_dvr.m3u8">التلفزيون السوري</option>
                <option value="http://82.137.248.16:1935/Snews/SnewLive3/playlist.m3u8">الأخبارية السورية</option>
                <option value="http://82.137.248.21:1935/Aloula/AloulaLive3/playlist.m3u8">القناة الأولى</option>
            </optgroup<optgroup label="قنوات أخرى">
    <option value="https://live-hls-web-aja.getaj.net/AJA/01.m3u8">الجزيرة</option>
</optgroup>
            
            <!-- قناة تجريبية للتأكد من عمل المشغل دائماً -->
            <optgroup label="قنوات أخرى">
                <option value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">قناة تجريبية</option>
            </optgroup>
        </select>
    </div>

    <!-- مشغل الفيديو -->
    <div class="player-container">
        <video id="videoPlayer" controls></video>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const select = document.getElementById('channelSelect');

        // تغيير القناة وتشغيلها عند الاختيار
        select.addEventListener('change', function() {
            if(this.value) {
                video.src = this.value;
                video.play();
            }
        });
    </script>

</body>
</html>
